    };
    document.addEventListener("click", mark);
    document.addEventListener("focusin", mark);
  }

  // 光标行 → 数据模型坐标 { g: 项目组下标, s: 工序下标 }；表头/无效行返回 null
  function locateCursor() {
    if (!cursorTr || !cursorTr.isConnected) return null;
    const body = document.getElementById("tableBody");
    const idx = Array.prototype.indexOf.call(body.rows, cursorTr) - 2; // 前两行为表头
    if (idx < 0) return null;
    let rest = idx;
    for (let g = 0; g < groups.length; g++) {
      const len = groups[g].steps.length;
      if (rest < len) return { g: g, s: rest };
      rest -= len;
    }
    return null;
  }

  // ---------- DOM → 模型同步（结构操作前收割最新编辑内容） ----------
  function harvestDOM() {
    const rows = document.getElementById("tableBody").rows;
    let ptr = 2;
    const val = td => td ? td.innerText.replace(/\u00a0/g, " ").replace(/\s+$/g, "") : "";
    groups.forEach(g => {
      g.steps.forEach((s, i) => {
        const tr = rows[ptr++];
        if (!tr) return;
        if (i === 0) {
          GROUP_COLS.forEach((k, ci) => { g[k] = val(tr.cells[ci]); });
          STEP_COLS.forEach((k, ci) => { s[k] = val(tr.cells[5 + ci]); });
        } else {
          STEP_COLS.forEach((k, ci) => { s[k] = val(tr.cells[ci]); });
        }
      });
    });
  }

  function blankStep() { const o = { id: uid() }; STEP_COLS.forEach(k => { o[k] = ""; }); return o; }
  function blankProject() { return { id: uid(), no: "", item: "", name: "", draw: "", qty: "", steps: [blankStep()] }; }
  function renumber() { groups.forEach((g, i) => { g.no = String(i + 1); }); }

  function afterOp() {
    cursorTr = null;                       // 结构变化后原光标行已被重建，清空避免残留引用
    if (cursorChangeCb) cursorChangeCb();
  }

  // ---------- 四个结构操作（均先收割 DOM，再改模型、重排序号、重渲染、持久化） ----------
  function addProject() {
    harvestDOM();
    groups.push(blankProject());
    renumber(); render(); persistStructure();
    afterOp();
  }

  function deleteProject() {
    const loc = locateCursor();
    if (!loc) return false;
    harvestDOM();
    groups.splice(loc.g, 1);
    renumber(); render(); persistStructure();
    afterOp();
    return true;
  }

  function addStepAfter() {
    const loc = locateCursor();
    if (!loc) return false;
    harvestDOM();
    groups[loc.g].steps.splice(loc.s + 1, 0, blankStep());
    renumber(); render(); persistStructure();
    afterOp();
    return true;
  }

  function deleteStep() {
    const loc = locateCursor();
    if (!loc || groups[loc.g].steps.length <= 1) return false;
    harvestDOM();
    groups[loc.g].steps.splice(loc.s, 1);
    renumber(); render(); persistStructure();
    afterOp();
    return true;
  }

  // ---------- 边界判断 ----------
  function canOperate()   { return !!locateCursor(); }
  function canDeleteStep() {
    const loc = locateCursor();
    return !!(loc && groups[loc.g].steps.length > 1);
  }

  function setOnCursorChange(fn) { cursorChangeCb = fn; }

  // ---------- 多端同步支持 ----------
  // 按稳定单元格键写值：{gid}.p.{列序}（项目列）| {gid}.{工序id}.{列序}（工序列）
  // noRender=true 时不立即重绘（批量合并用）
  function applyCellKey(key, value, noRender) {
    const parts = String(key).split(".");
    if (parts.length !== 3 || parts[0] === "h" || parts[0] === "f") return false;
    const g = groups.find(x => x.id === parts[0]);
    if (!g) return false;
    const i = Number(parts[2]);
    if (parts[1] === "p") {
      if (!(i >= 0 && i < GROUP_COLS.length)) return false;
      g[GROUP_COLS[i]] = String(value == null ? "" : value);
    } else {
      const s = g.steps.find(x => x.id === parts[1]);
      if (!s || !(i >= 0 && i < STEP_COLS.length)) return false;
      s[STEP_COLS[i]] = String(value == null ? "" : value);
    }
    if (!noRender) { render(); persistStructure(); }
    return true;
  }

  // 批量写入后统一重绘并持久化
  function refresh() { render(); persistStructure(); }

  // 采纳远端整份结构快照（结构操作同步）
  function adoptModel(model) {
    if (!Array.isArray(model) || model.length === 0 ||
        !model.every(x => x && Array.isArray(x.steps) && x.steps.length > 0)) return false;
    groups = model;
    migrate();
    cursorTr = null;
    render(); persistStructure();
    if (cursorChangeCb) cursorChangeCb();
    return true;
  }

  // 初始化：优先从本地持久化结构恢复，再渲染
  function init() {
    loadStructure();
    render();
    bindCursor();
  }

  return {
    init: init,
    render: render,
    addProject: addProject,
    deleteProject: deleteProject,
    addStepAfter: addStepAfter,
    deleteStep: deleteStep,
    canOperate: canOperate,
    canDeleteStep: canDeleteStep,
    locateCursor: locateCursor,
    setOnCursorChange: setOnCursorChange,
    applyCellKey: applyCellKey,
    adoptModel: adoptModel,
    refresh: refresh,
    persistStructure: persistStructure,
    setHeaderField: setHeaderField,
    uid: uid
  };
})();


/* ================================================================
 * 模块二：截图处理模块（CaptureModule）
 * 纯原生 Canvas 矢量重绘方案：读取实时 DOM 表格内容与样式参数，
 * 用 Canvas 2D API 逐单元格绘制边框/底色/文字 → 高清 PNG Blob。
 * 不加载任何图片资源，Canvas 永远不会被污染（跨浏览器、离线可用）。
 * ================================================================ */
const CaptureModule = (() => {
  const SCALE = 2;        // 2 倍像素密度，保证微信中文字清晰无锯齿
  const PAD_X = 16;       // 截图区域左右内边距（与 #captureArea 一致）
  const PAD_Y = 14;       // 截图区域上下内边距
  const CELL_PAD_X = 6;   // 单元格内边距
  const CELL_PAD_Y = 4;

  const FONT_BODY  = '14px "SimSun","宋体","Songti SC",serif';
  const FONT_HEAD  = 'bold 14px "SimSun","宋体","Songti SC",serif';
  const FONT_TITLE = '30px "STXingkai","华文行楷","KaiTi","楷体",cursive';

  // 按可用宽度逐字符贪心折行（与 CSS word-break:break-all 行为一致），尊重显式换行
  function wrapLines(ctx, text, maxW) {
    const lines = [];
    String(text).split("\n").forEach(para => {
      if (para === "") { lines.push(""); return; }
      let cur = "";
      for (const ch of para) {
        if (cur && ctx.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
        else cur += ch;
      }
      lines.push(cur);
    });
    return lines;
  }

  /**
   * 将报表区域实时渲染为 PNG Blob
   * @param {HTMLElement} element #captureArea
   * @returns {Promise<Blob>} image/png
   */
  async function capture(element) {
    if (document.fonts && document.fonts.ready) await document.fonts.ready;
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();

    const table = element.querySelector("table.report");
    if (!table) throw new Error("未找到报表表格");

    /* ---------- 1. 几何：列宽（取 colgroup 固定宽度） ---------- */
    const colW = Array.prototype.map.call(
      table.querySelectorAll("colgroup col"),
      col => parseInt(col.style.width, 10) || 0
    );
    const colX = [0];
    colW.forEach(w => colX.push(colX[colX.length - 1] + w));
    const tableW = colX[colX.length - 1];

    /* ---------- 2. 读取实时 DOM：单元格内容、行列位置、合并、样式 ---------- */
    const rows = Array.prototype.slice.call(table.rows);
    const occupied = Object.create(null);
    const cells = [];
    rows.forEach((tr, r) => {
      let c = 0;
      Array.prototype.forEach.call(tr.cells, cell => {
        while (occupied[r + "_" + c]) c++;
        cells.push({
          r, c,
          rs: cell.rowSpan || 1,
          cs: cell.colSpan || 1,
          text: cell.innerText.replace(/ /g, " ").replace(/\s+$/g, ""),
          cls: cell.className || ""
        });
        for (let i = 0; i < (cell.rowSpan || 1); i++)
          for (let j = 0; j < (cell.colSpan || 1); j++)
            occupied[(r + i) + "_" + (c + j)] = 1;
        c += cell.colSpan || 1;
      });
    });

    /* ---------- 3. 行高：以页面实际渲染高度为准 ---------- */
    const rowH = rows.map(tr => tr.offsetHeight);

    /* ---------- 4. 离屏测量，准备 Canvas ---------- */
    const measure = document.createElement("canvas").getContext("2d");
    const fontOf = cell => cell.cls.indexOf("title-cell") >= 0 ? FONT_TITLE
                         : cell.cls.indexOf("col-label") >= 0  ? FONT_HEAD : FONT_BODY;

    // 预折行；跨行合并单元格若内容超高，则把高度差补到该合并块
    cells.forEach(cell => {
      measure.font = fontOf(cell);
      const x1 = colX[cell.c], x2 = colX[cell.c + cell.cs];
      const availW = Math.max(10, (x2 - x1) - CELL_PAD_X * 2);
      cell.lines = wrapLines(measure, cell.text, availW);
      const fs = cell.cls.indexOf("title-cell") >= 0 ? 30 : 14;
      const lh = fs * 1.25;
      cell.needH = Math.ceil(cell.lines.length * lh + CELL_PAD_Y * 2);
      if (cell.rs > 1) {
        let blockH = 0;
        for (let i = 0; i < cell.rs; i++) blockH += rowH[cell.r + i] || 0;
        if (cell.needH > blockH) {
          rowH[cell.r + cell.rs - 1] = (rowH[cell.r + cell.rs - 1] || 0) + (cell.needH - blockH);
        }
      }
    });

    const rowY = [0];
    rowH.forEach(h => rowY.push(rowY[rowY.length - 1] + h));
    const tableH = rowY[rowY.length - 1];

    // 底部备注（.foot-notes，grid-column 与表格列对齐）
    const notes = Array.prototype.map.call(
      element.querySelectorAll(".foot-notes span[contenteditable]"),
      sp => {
        const start = parseInt((sp.style.gridColumn || "").split("/")[0], 10);
        return { text: sp.innerText.replace(/\s+$/g, ""), col: isNaN(start) ? 1 : start };
      }
    ).filter(n => n.text);

    const footH = notes.length ? 14 * 1.25 + 8 : 0;
    const W = tableW + PAD_X * 2;
    const H = PAD_Y * 2 + tableH + footH;

    /* ---------- 5. 高倍率 Canvas 绘制 ---------- */
    const canvas = document.createElement("canvas");
    canvas.width = Math.ceil(W * SCALE);
    canvas.height = Math.ceil(H * SCALE);
    const ctx = canvas.getContext("2d");
    ctx.scale(SCALE, SCALE);
    ctx.textBaseline = "alphabetic";

    // 白底（避免透明图在微信里变黑）
    ctx.fillStyle = "#ffffff";
    ctx.fillRect(0, 0, W, H);

    // 5.1 单元格底色
    cells.forEach(cell => {
      ctx.fillStyle = cell.cls.indexOf("col-label") >= 0 ? "#f5f7fa" : "#ffffff";
      ctx.fillRect(PAD_X + colX[cell.c], PAD_Y + rowY[cell.r],
                   colX[cell.c + cell.cs] - colX[cell.c],
                   rowY[cell.r + cell.rs] - rowY[cell.r]);
    });

    // 5.2 边框（border-collapse 效果；合并单元格内部不画线）
    const blockedH = Object.create(null); // 被行合并遮住的横线: 边界行_列
    const blockedV = Object.create(null); // 被列合并遮住的竖线: 行_边界列
    cells.forEach(cell => {
      for (let i = 1; i < cell.rs; i++)
        for (let j = 0; j < cell.cs; j++)
          blockedH[(cell.r + i) + "_" + (cell.c + j)] = 1;
      for (let i = 0; i < cell.rs; i++)
        for (let j = 1; j < cell.cs; j++)
          blockedV[(cell.r + i) + "_" + (cell.c + j)] = 1;
    });
    ctx.strokeStyle = "#000000";
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let y = 0; y <= rows.length; y++) {           // 横线
      for (let j = 0; j < colW.length; j++) {
        if (y > 0 && y < rows.length && blockedH[y + "_" + j]) continue;
        ctx.moveTo(PAD_X + colX[j], PAD_Y + rowY[y] + 0.5);
        ctx.lineTo(PAD_X + colX[j + 1], PAD_Y + rowY[y] + 0.5);
      }
    }
    for (let x = 0; x <= colW.length; x++) {           // 竖线
      for (let i = 0; i < rows.length; i++) {
        if (x > 0 && x < colW.length && blockedV[i + "_" + x]) continue;
        ctx.moveTo(PAD_X + colX[x] + 0.5, PAD_Y + rowY[i]);
        ctx.lineTo(PAD_X + colX[x] + 0.5, PAD_Y + rowY[i + 1]);
      }
    }
    ctx.stroke();

    // 5.3 文字（水平+垂直居中，多行按真实折行结果）
    cells.forEach(cell => {
      if (!cell.text) return;
      const isTitle = cell.cls.indexOf("title-cell") >= 0;
      const fs = isTitle ? 30 : 14;
      const lh = fs * 1.25;
      ctx.font = fontOf(cell);
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";
      try { ctx.letterSpacing = isTitle ? "3px" : "normal"; } catch (e) {}

      const boxX = PAD_X + colX[cell.c], boxW = colX[cell.c + cell.cs] - colX[cell.c];
      const boxY = PAD_Y + rowY[cell.r], boxH = rowY[cell.r + cell.rs] - rowY[cell.r];
      const midX = boxX + boxW / 2;
      const top0 = boxY + (boxH - cell.lines.length * lh) / 2;
      cell.lines.forEach((line, i) => {
        ctx.fillText(line, midX, top0 + i * lh + fs * 0.85, boxW - CELL_PAD_X * 2);
      });
    });
    try { ctx.letterSpacing = "normal"; } catch (e) {}

    // 5.4 底部备注文字
    ctx.font = FONT_BODY;
    ctx.fillStyle = "#000000";
    ctx.textAlign = "left";
    const footBaseY = PAD_Y + tableH + 8 + 14;
    notes.forEach(n => {
      ctx.fillText(n.text, PAD_X + colX[n.col - 1], footBaseY);
    });

    /* ---------- 6. 导出 PNG ---------- */
    return await new Promise((resolve, reject) => {
      canvas.toBlob(blob => {
        if (blob) resolve(blob);
        else reject(new Error("Canvas 导出 PNG 失败"));
      }, "image/png");
    });
  }

  return { capture };
})();


/* ================================================================
 * 模块三：剪贴板操作模块（ClipboardModule）
 * 严格使用 W3C Clipboard API（navigator.clipboard.write + ClipboardItem）
 * ================================================================ */
const ClipboardModule = (() => {

  // 是否支持向剪贴板写入 PNG 图片
  function isImageWriteSupported() {
    return !!(navigator.clipboard && window.ClipboardItem &&
              typeof navigator.clipboard.write === "function");
  }

  // 写入 PNG；失败时抛出带错误类型的异常
  async function writePng(blob) {
    if (!isImageWriteSupported()) {
      throw Object.assign(new Error("当前浏览器不支持 ClipboardItem 图片写入"), { code: "UNSUPPORTED" });
    }
    try {
      await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]);
    } catch (err) {
      const e = err || new Error();
      if (e.name === "NotAllowedError") {
        throw Object.assign(new Error("剪贴板权限被拒绝或本次操作不是点击手势触发"), { code: "NOT_ALLOWED" });
      }
      throw Object.assign(new Error(e.message || "剪贴板写入失败"), { code: e.name || "ERROR" });
    }
  }

  // 通用浏览器下载
  function download(blob, filename) {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  }

  function defaultFileName() {
    const d = new Date();
    const p = n => String(n).padStart(2, "0");
    return "加工完成报表_" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) +
           "_" + p(d.getHours()) + p(d.getMinutes()) + ".png";
  }

  return { isImageWriteSupported, writePng, download, defaultFileName };
})();


/* ================================================================
 * 模块四：UI 交互模块（UIModule）
 * 负责：按钮状态机（加载中/成功/失败）、状态提示、事件绑定
 * ================================================================ */
const UIModule = (() => {
  const statusEl = document.getElementById("status");
  const copyBtn  = document.getElementById("btnCopy");
  const copyText = copyBtn.querySelector(".btn-text");

  let timer = null;
  function show(type, msg, sticky) {
    statusEl.className = "status show " + type;
    statusEl.textContent = msg;
    clearTimeout(timer);
    if (!sticky) {
      timer = setTimeout(() => { statusEl.className = "status"; }, 8000);
    }
  }
  function clear() { clearTimeout(timer); statusEl.className = "status"; statusEl.textContent = ""; }

  function setLoading(loading, text) {
    copyBtn.disabled = loading;
    copyBtn.classList.toggle("loading", loading);
    copyText.textContent = text || (loading ? "正在处理…" : "复制表格到剪贴板");
  }

  function advise(errCode) {
    switch (errCode) {
      case "NOT_ALLOWED":
        return "解决建议：请直接用鼠标/手指点击本按钮触发（不要用脚本自动调用），并在浏览器弹出的权限提示中选择“允许”；或将浏览器升级到最新版。";
      case "UNSUPPORTED":
        return "解决建议：推荐改用 Chrome / Edge 最新版；当前已自动下载 PNG 图片，可在微信中直接发送该图片。";
      case "SecurityError":
        return "解决建议：请将本 HTML 文件保存到本地后双击打开（file://），或通过 https 访问。";
      default:
        return "解决建议：请刷新页面重试，或改用 Chrome / Edge 最新版；也可直接点击「下载PNG图片」后手动发送到微信。";
    }
  }

  // 核心流程：截图 → 写剪贴板 →（失败）自动下载兜底
  async function copyTable() {
    clear();
    setLoading(true, "正在生成高清图片…");
    show("info", "正在截取表格并生成高清 PNG 图片，请稍候…");
    let blob;
    try {
      blob = await CaptureModule.capture(document.getElementById("captureArea"));
    } catch (e) {
      setLoading(false);
      show("error", "截图失败：" + (e.message || e) + " " + advise(""), true);
      return;
    }

    setLoading(true, "正在写入剪贴板…");
    try {
      await ClipboardModule.writePng(blob);
      setLoading(false);
      const isMac = /mac/i.test(navigator.platform || "");
      show("success",
        "表格图片已复制到剪贴板！打开微信（PC 聊天框 / 文件传输助手按 " +
        (isMac ? "Command+V" : "Ctrl+V") + "；手机端在输入框长按→粘贴）即可发送。图片为 2 倍高清 PNG，文字清晰。");
    } catch (e) {
      // 剪贴板不可用 / 权限拒绝：同一图片自动下载，保证流程不中断
      ClipboardModule.download(blob, ClipboardModule.defaultFileName());
      setLoading(false);
      show("warn", "未能写入剪贴板（" + e.message + "）。高清 PNG 图片已自动下载，可直接在微信中发送。" + advise(e.code), true);
    }
  }

  async function downloadOnly() {
    clear();
    show("info", "正在生成高清 PNG 图片…");
    try {
      const blob = await CaptureModule.capture(document.getElementById("captureArea"));
      ClipboardModule.download(blob, ClipboardModule.defaultFileName());
      show("success", "PNG 图片已生成并开始下载，可直接发送到微信。");
    } catch (e) {
      show("error", "生成图片失败：" + (e.message || e) + " " + advise(""), true);
    }
  }

  // ---------- 项目 / 工序行结构操作 ----------
  const btnAddProject = document.getElementById("btnAddProject");
  const btnDelProject = document.getElementById("btnDelProject");
  const btnAddStep    = document.getElementById("btnAddStep");
  const btnDelStep    = document.getElementById("btnDelStep");

  // 置灰/恢复按钮；disabledHint 为禁用时的友好提示（点击时弹出）
  function setOpState(btn, enabled, enabledHint, disabledHint) {
    btn.classList.toggle("is-disabled", !enabled);
    btn.setAttribute("aria-disabled", String(!enabled));
    btn.title = enabled ? enabledHint : disabledHint;
    btn.dataset.disabledHint = disabledHint;
  }

  // 根据光标位置刷新四个按钮的可用状态
  function updateOpButtons() {
    const hasRow = TableModule.canOperate();
    setOpState(btnDelProject, hasRow,
      "删除当前光标所在的项目（含其全部工序行）",
      "请先在表格中点击选择一个项目数据行");
    setOpState(btnAddStep, hasRow,
      "在当前光标所在工序行下方插入一个空白工序行",
      "请先在表格中点击选择一个工序行");
    const stepLoc = TableModule.locateCursor();
    setOpState(btnDelStep, TableModule.canDeleteStep(),
      "删除当前光标所在的工序行（不影响项目列）",
      hasRow && stepLoc
        ? "该项目仅剩一个工序行，如需删除请使用「删除项目」"
        : "请先在表格中点击选择一个工序行");
  }

  // 结构操作统一入口：先等自动保存落盘 → 执行操作 → 重置自动保存基线
  async function runStructureOp(btn, op, okMsg) {
    if (btn.classList.contains("is-disabled")) {
      show("warn", btn.dataset.disabledHint || "当前没有可操作的行。", true);
      return;
    }
    await AutoSaveApp.flushAndSettle();
    const ok = op();
    AutoSaveApp.afterStructureChange();
    SyncModule.publishStructure();          // 结构变更广播给其他设备（离线时入补传队列）
    updateOpButtons();
    if (ok !== false) show("success", okMsg);
  }

  function bind() {
    copyBtn.addEventListener("click", copyTable);
    document.getElementById("btnDownload").addEventListener("click", downloadOnly);

    btnAddProject.addEventListener("click", () =>
      runStructureOp(btnAddProject, () => TableModule.addProject(),
        "已在表格末尾新增一个空白项目行，可直接点击单元格编辑。"));
    btnDelProject.addEventListener("click", () =>
      runStructureOp(btnDelProject, () => TableModule.deleteProject(),
        "已删除当前项目及其全部工序行。"));
    btnAddStep.addEventListener("click", () =>
      runStructureOp(btnAddStep, () => TableModule.addStepAfter(),
        "已在当前工序行下方插入一个空白工序行。"));
    btnDelStep.addEventListener("click", () =>
      runStructureOp(btnDelStep, () => TableModule.deleteStep(),
        "已删除当前工序行。"));
    TableModule.setOnCursorChange(updateOpButtons);
    updateOpButtons();

    // 环境检测：不支持图片剪贴板或非安全上下文时给出前置提示
    if (!window.isSecureContext) {
      show("warn", "当前不是安全上下文（https 或本地文件），剪贴板写入可能被浏览器拦截；届时会自动下载 PNG 图片兜底。", true);
    } else if (!ClipboardModule.isImageWriteSupported()) {
      show("warn", "当前浏览器版本可能不支持直接写入图片剪贴板，点击复制时将自动下载高清 PNG 供手动发送；推荐使用最新版 Chrome / Edge。", true);
    }
  }

  return { bind, show };
})();


/* ================================================================
 * 模块五：自动保存核心（createAutoSaveCore）
 * 纯逻辑、零 DOM 依赖，便于单元测试。
 * 能力：输入防抖（默认 500ms）→ 批次合并（同键取最新值，多键合一次请求）
 *       → 保存状态机（pending/saving/saved/error）→ 失败回滚暂存区 + 手动重试
 *       → 并发保护（在途时新编辑进入下一批次，不丢失）
 * 注意：《自动保存单元测试.html》内含本段源码副本，修改时请保持同步。
 * ================================================================ */
function createAutoSaveCore(opts) {
  const debounceMs = opts.debounceMs == null ? 500 : opts.debounceMs;
  const api = opts.api;                                        // { save(batch: Map) => Promise }
  const setT = opts.setTimeoutFn || function (fn, ms) { return setTimeout(fn, ms); };
  const clearT = opts.clearTimeoutFn || function (id) { clearTimeout(id); };
  const onState = opts.onStateChange || function () {};        // 状态变化回调

  let pending = new Map();   // 待保存暂存区：cellId -> 最新值（同键自动合并）
  let saving = new Map();    // 在途批次：cellId -> 值
  let statuses = new Map();  // cellId -> 'pending' | 'saving' | 'saved' | 'error'
  let timer = null;
  let retryQueued = false;   // 在途期间点击过重试 → 本批结束后自动重发
  let lastError = null;
  let lastSavedAt = null;

  function clone(m) { return new Map(m); }

  function getStats() {
    let errorCount = 0;
    statuses.forEach(s => { if (s === "error") errorCount++; });
    return {
      pendingCount: pending.size,
      savingCount: saving.size,
      errorCount: errorCount,
      lastError: lastError,
      lastSavedAt: lastSavedAt,
      hasUnsaved: pending.size > 0 || saving.size > 0
    };
  }

  function emit() { onState({ statuses: clone(statuses), stats: getStats() }); }

  function schedule() {
    if (timer) clearT(timer);
    timer = setT(function () { timer = null; flush(); }, debounceMs);
  }

  // 记录一次单元格修改：合并同批次内容并重置防抖计时（频繁输入只保留最新值）
  function recordChange(cellId, value) {
    const id = String(cellId);
    pending.set(id, String(value));
    statuses.set(id, "pending");
    schedule();
    emit();
  }

  // 立即取消防抖并保存当前暂存区（页面切后台 / 手动触发时使用）
  function flushNow() { return flush(); }

  function flush() {
    if (timer) { clearT(timer); timer = null; }
    if (saving.size > 0 || pending.size === 0) return Promise.resolve();

    const batch = new Map(pending);      // 合并本批次全部修改为一次请求
    pending = new Map();
    batch.forEach(function (_v, id) { statuses.set(id, "saving"); });
    saving = batch;
    emit();

    return (async function () {
      try {
        await api.save(clone(batch));
        batch.forEach(function (_v, id) {
          if (statuses.get(id) === "saving") statuses.set(id, "saved");
        });
        lastError = null;
        lastSavedAt = new Date();
      } catch (err) {
        lastError = err && err.message ? err.message : String(err);
        batch.forEach(function (v, id) {
          pending.set(id, v);            // 保存失败：回滚至暂存区等待重试
          statuses.set(id, "error");
        });
      } finally {
        saving = new Map();
        emit();
        let hasNormal = false;
        statuses.forEach(function (s, id) {
          if (pending.has(id) && s === "pending") hasNormal = true;
        });
        if (pending.size > 0 && (retryQueued || hasNormal)) {
          retryQueued = false;
          schedule();                    // 在途期间的并发编辑 → 自动排下一批次
        }
      }
    })();
  }

  // 重试所有保存失败的内容（在途时先排队，本批结束后自动重发）
  function retryFailed() {
    if (saving.size > 0) { retryQueued = true; return Promise.resolve(); }
    return flush();
  }

  // 未保存内容合集（待存 + 在途），供页面离开兜底持久化使用
  function getPendingChanges() {
    const m = new Map(saving);
    pending.forEach(function (v, k) { m.set(k, v); });
    return m;
  }

  function statusOf(cellId) { return statuses.get(String(cellId)) || "idle"; }

  // 清空全部状态（导入 JSON 等场景重置基线）
  function reset() {
    if (timer) { clearT(timer); timer = null; }
    pending = new Map(); saving = new Map(); statuses = new Map();
    retryQueued = false; lastError = null; lastSavedAt = null;
    emit();
  }

  return {
    recordChange: recordChange,
    flushNow: flushNow,
    retryFailed: retryFailed,
    getPendingChanges: getPendingChanges,
    getStats: getStats,
    statusOf: statusOf,
    reset: reset
  };
}


/* ================================================================
 * 模块六：自动保存页面适配层（AutoSaveApp）
 * 职责：为可编辑单元格分配稳定 ID、事件委托捕获输入、本地暂存 API、
 *       单元格/行状态标记渲染、工具条状态牌、错误提示与重试、离开保护
 * ================================================================ */
const AutoSaveApp = (() => {
  const STORE_KEY = "report_autosave_v1";
  const DEBOUNCE_MS = 500;

  let core = null;
  let chipEl, chipTextEl, retryBtn;
  let rafId = 0;
  let latest = null;
  let prevErrorCount = 0;

  const delay = ms => new Promise(r => setTimeout(r, ms));

  function readStore() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || "{}") || {}; }
    catch (e) { return {}; }
  }
  function writeStore(obj) { localStorage.setItem(STORE_KEY, JSON.stringify(obj)); }

  // 本地暂存版保存接口：模拟 250ms 接口耗时（防抖后仍合并为一次调用）。
  // 接入真实后端时仅需将本对象替换为 fetch(...) 实现，签名保持 { save(batch) }；
  // 若需离开页面兜底上报，可在 pagehide 中改用 navigator.sendBeacon。
  const api = {
    async save(batch) {
      // 同步广播不等本地落盘：防抖触发即发出，与模拟保存并行（远端按 cellTs 做 LWW 合并，顺序无关）
      if (typeof SyncModule !== "undefined" && SyncModule.publishCellOps) {
        SyncModule.publishCellOps(batch);
      }
      await delay(120);   // 压缩模拟耗时以满足“1秒内同步”目标；接入真实接口后通常更快
      const snap = readStore();
      batch.forEach((v, k) => { snap[k] = v; });
      writeStore(snap);   // 配额超限等异常会向上抛出 → 触发错误标记与重试流程
      // 关键：本地编辑必须同步写入数据模型（单一事实来源）。
      // 否则快照构建/合并保护读不到键入值，远端快照采纳时会把这些值重置掉。
      let dirty = false;
      batch.forEach((v, k) => {
        if (TableModule.applyCellKey(k, v, true)) dirty = true;
        else if (k[0] === "h") TableModule.setHeaderField(k, v);   // 表头（标题/日期/班组）同步写入模型
      });
      if (dirty) TableModule.persistStructure();
    }
  };

  // 为所有可编辑单元格分配稳定 ID：表头 h列号 / 数据行 r行-列 / 底部备注 f序号
  function ensureCellIds() {
    const body = document.getElementById("tableBody");
    Array.prototype.forEach.call(body.rows, (tr, rIdx) => {
      Array.prototype.forEach.call(tr.cells, cell => {
        if (cell.getAttribute("contenteditable") !== "true") return;
        if (!cell.dataset.cid) {
          cell.dataset.cid = rIdx < 2 ? "h" + cell.cellIndex : "r" + rIdx + "-" + cell.cellIndex;
        }
      });
    });
    document.querySelectorAll(".foot-notes span[contenteditable]").forEach((sp, i) => {
      if (!sp.dataset.cid) sp.dataset.cid = "f" + i;
    });
  }

  // 页面加载时，将本地暂存的历史修改回填到表格（刷新不丢数据）
  // 注：表头 h* 键已由 TableModule.header 模型接管（buildHeaderRows 渲染），此处跳过避免双重来源冲突；
  // 底部备注 f* 仍走暂存回填。
  function applySnapshot() {
    const snap = readStore();
    Object.keys(snap).forEach(cid => {
      if (cid[0] === "h") return;
      const el = document.querySelector('[data-cid="' + cid + '"]');
      if (el) el.innerText = String(snap[cid] == null ? "" : snap[cid]);
    });
  }

  // 事件委托：任意可编辑单元格输入即记录（input 事件冒泡，单监听器覆盖全表）
  function bindInputDelegation() {
    document.addEventListener("input", e => {
      const el = e.target && e.target.closest ? e.target.closest("[data-cid]") : null;
      if (!el || !core) return;
      core.recordChange(el.dataset.cid, el.innerText.replace(/\u00a0/g, " "));
    });
  }

  // 渲染合批：一帧内最多重绘一次，避免频繁输入造成卡顿
  function renderState(payload) {
    latest = payload;
    if (rafId) return;
    rafId = requestAnimationFrame(() => { rafId = 0; paint(latest); });
  }

  function paintChip(stats) {
    chipEl.classList.remove("saved", "pending", "saving", "error");
    retryBtn.hidden = true;
    if (stats.errorCount > 0) {
      chipEl.classList.add("error");
      chipTextEl.textContent = stats.errorCount + " 项修改保存失败";
      retryBtn.hidden = false;
    } else if (stats.savingCount > 0) {
      chipEl.classList.add("saving");
      chipTextEl.textContent = "正在保存 " + stats.savingCount + " 项…";
    } else if (stats.pendingCount > 0) {
      chipEl.classList.add("pending");
      chipTextEl.textContent = stats.pendingCount + " 项修改待保存";
    } else if (stats.lastSavedAt) {
      chipEl.classList.add("saved");
      const p = n => String(n).padStart(2, "0");
      chipTextEl.textContent = "已自动保存 " + p(stats.lastSavedAt.getHours()) + ":" +
        p(stats.lastSavedAt.getMinutes()) + ":" + p(stats.lastSavedAt.getSeconds());
    } else {
      chipTextEl.textContent = "自动保存已开启";
    }
  }

  function paint(payload) {
    if (!payload) return;
    const { statuses, stats } = payload;
    const cellOf = cid => document.querySelector('[data-cid="' + cid + '"]');

    // 1. 单元格级状态标记
    statuses.forEach((st, cid) => {
      const el = cellOf(cid);
      if (!el) return;
      el.classList.remove("as-pending", "as-saving", "as-saved", "as-error");
      if (st === "pending" || st === "saving" || st === "error") el.classList.add("as-" + st);
      else if (st === "saved") el.classList.add("as-saved");   // 播放一次绿色闪烁
    });

    // 2. 行级状态标记（该行存在未保存/失败单元格时着色）
    const rowState = new Map();
    statuses.forEach((st, cid) => {
      if (st !== "pending" && st !== "saving" && st !== "error") return;
      const el = cellOf(cid);
      const tr = el && el.closest ? el.closest("tr") : null;
      if (!tr) return;
      const cur = rowState.get(tr) || { err: false };
      if (st === "error") cur.err = true;
      rowState.set(tr, cur);
    });
    document.querySelectorAll("tr.as-row-unsaved, tr.as-row-error").forEach(tr => {
      tr.classList.remove("as-row-unsaved", "as-row-error");
    });
    rowState.forEach((s, tr) => tr.classList.add(s.err ? "as-row-error" : "as-row-unsaved"));

    // 3. 工具条状态牌（保存成功为静默提示，不打断操作）
    paintChip(stats);

    // 4. 失败时的明确错误信息（常驻，直到恢复）
    if (stats.errorCount > 0 && prevErrorCount === 0) {
      UIModule.show("error", "自动保存失败：" + (stats.lastError || "未知错误") +
        "。共 " + stats.errorCount + " 项修改未保存，可点击上方「重试」按钮重发，或继续编辑该单元格后自动重试。", true);
    } else if (stats.errorCount === 0 && prevErrorCount > 0) {
      UIModule.show("success", "自动保存已恢复：之前失败的修改已全部保存。");
    }
    prevErrorCount = stats.errorCount;
  }

  // 页面离开 / 路由跳转保护
  function bindLifecycle() {
    // 存在未保存内容时，刷新/关闭/跳转前弹出浏览器确认框
    window.addEventListener("beforeunload", e => {
      if (core && core.getStats().hasUnsaved) { e.preventDefault(); e.returnValue = ""; }
    });
    // 用户确认离开后（pagehide）：把未保存内容同步写入本地暂存，双保险防丢失
    window.addEventListener("pagehide", () => {
      if (!core) return;
      const m = core.getPendingChanges();
      if (!m.size) return;
      try {
        const snap = readStore();
        m.forEach((v, k) => { snap[k] = v; });
        writeStore(snap);
      } catch (e) { /* 兜底尽力而为 */ }
    });
    // 切到后台时立即保存一次，缩小未保存窗口
    document.addEventListener("visibilitychange", () => {
      if (document.hidden && core) core.flushNow();
    });
  }

  function init() {
    ensureCellIds();
    applySnapshot();
    chipEl = document.getElementById("autosaveChip");
    chipTextEl = document.getElementById("autosaveText");
    retryBtn = document.getElementById("btnRetrySave");
    core = createAutoSaveCore({ api: api, debounceMs: DEBOUNCE_MS, onStateChange: renderState });
    bindInputDelegation();
    bindLifecycle();
    // 监听表格 DOM 重建：任何 render（增删行/同步快照采纳/refresh）都会重建表头单元格，
    // 导致其丢失 data-cid，输入事件无法触发自动保存。用 MutationObserver 在节点插入后自动补全。
    const body = document.getElementById("tableBody");
    if (body) {
      const cidObserver = new MutationObserver(() => ensureCellIds());
      cidObserver.observe(body, { childList: true, subtree: true });
    }
    retryBtn.addEventListener("click", () => {
      UIModule.show("info", "正在重试保存未完成的修改…");
      core.retryFailed();
    });
    renderState({ statuses: new Map(), stats: core.getStats() });
  }

  // 将暂存区立即落盘并等待在途保存完成（结构操作前调用，避免数据错位）
  async function flushAndSettle() {
    if (!core) return;
    core.flushNow();
    for (let i = 0; i < 60 && core.getStats().hasUnsaved; i++) await delay(50);
  }

  // 表格结构变化（增删项目/工序行、导入 JSON）后调用：
  // 结构已随模型持久化 → 清除数据区暂存（仅保留表头 h* 与底部备注 f*）
  function afterStructureChange() {
    if (!core) return;
    try {
      const snap = readStore();
      const kept = {};
      Object.keys(snap).forEach(k => { if (k[0] === "h" || k[0] === "f") kept[k] = snap[k]; });
      writeStore(kept);
    } catch (e) {}
    prevErrorCount = 0;
    core.reset();
    ensureCellIds();
    renderState({ statuses: new Map(), stats: core.getStats() });
  }

  return { init: init, flushAndSettle: flushAndSettle, afterStructureChange: afterStructureChange };
})();


/* ================================================================
 * 模块七：多端实时同步（SyncModule）
 * 通道：MQTT over WSS 公共中继（EMQX 中国节点优先，自动切换备用节点）
 * 设计：
 *  - 房间号隔离：同房间号的设备互相同步；房间号即凭据，随机生成可复制到手机
 *  - 单元格级 LWW 冲突合并：每个单元格带时间戳，仅接受更新的变更（防覆盖丢失）
 *  - 稳定键：{项目id}.p.{列} / {项目id}.{工序id}.{列}，结构变化不影响其他单元格键
 *  - 结构操作：整快照（模型+时间戳表+版本）发布至 retained 主题；Lamport 版本号
 *  - 离线补传：outbox 持久化本地，断网期间修改在重连后自动补发
 *  - 弱网：QoS1 + 持久会话(clean:false) + 自动重连 + 确定性时间桶节点轮换 +
 *          回前台恢复 + 60 秒卡死看门狗强制重建
 *  - 快照治愈：快照含完整模型与时间戳表，结构相同也按 ts 合并数据区，
 *          错过的增量由 hello/ack 快照自动补齐
 * ================================================================ */
const SyncModule = (() => {
  const ROOM_KEY = "report_sync_room";
  const DEV_KEY = "report_sync_dev";
  const TS_KEY = "report_sync_ts_v1";
  const OUTBOX_KEY = "report_sync_outbox_v1";
  const BROKERS = [
    "wss://broker-cn.emqx.io:8084/mqtt",
    "wss://broker.emqx.io:8084/mqtt",
    "wss://test.mosquitto.org:8081"
  ];
  const CDNS = [
    "https://registry.npmmirror.com/mqtt/5.10.1/files/dist/mqtt.min.js",
    "https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js",
    "https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"
  ];

  // 设备 ID 用 sessionStorage（每个标签页/设备唯一）：既用于忽略自身消息，
  // 也避免同浏览器多标签页共用 clientId 被 MQTT 中继互踢
  let DEV = sessionStorage.getItem(DEV_KEY);
  if (!DEV) { DEV = "d" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); try { sessionStorage.setItem(DEV_KEY, DEV); } catch (e) {} }

  let room = localStorage.getItem(ROOM_KEY) || null;
  if (!room) {   // 首次使用自动生成房间号（默认开启同步），可在面板中复制到其他设备
    room = "r" + Math.random().toString(36).slice(2, 8);
    try { localStorage.setItem(ROOM_KEY, room); } catch (e) {}
  }
  let cellTs = {};      // cid -> 已知最新时间戳（本地+远端），LWW 依据
  let outbox = [];      // 待发布队列（离线补传）
  let rev = 0;          // 结构版本（Lamport：本地/远端取 max + 1）
  let client = null, brokerIdx = 0, status = "off", statusCb = null;
  let draining = false, pendingState = null, lastApply = 0, tsTimer = 0, stuckSince = 0;

  try { cellTs = JSON.parse(localStorage.getItem(TS_KEY) || "{}") || {}; } catch (e) {}
  try { outbox = JSON.parse(localStorage.getItem(OUTBOX_KEY) || "[]") || []; } catch (e) {}

  const T_S = () => "gdreport/" + room + "/state";
  const T_O = () => "gdreport/" + room + "/op";
  const T_H = () => "gdreport/" + room + "/hello";

  function persistTs() { try { localStorage.setItem(TS_KEY, JSON.stringify(cellTs)); } catch (e) {} }
  function persistTsSoon() { clearTimeout(tsTimer); tsTimer = setTimeout(persistTs, 800); }
  function persistOutbox() { try { localStorage.setItem(OUTBOX_KEY, JSON.stringify(outbox)); } catch (e) {} }

  function setStatus(s) {
    status = s;
    paintChip();
    if (statusCb) statusCb(s);
  }

  function getState() { return { status: status, room: room, outbox: outbox.length }; }
  function onStatusChange(fn) { statusCb = fn; }

  // ---------- 状态牌与房间设置面板 ----------
  let chipEl, chipText, popEl, roomInput;

  function paintChip() {
    if (!chipEl) return;
    chipEl.classList.remove("saved", "pending", "saving", "error");
    const map = {
      online:       ["saved",   "已连接 · 实时同步中"],
      connecting:   ["saving",  "同步连接中…"],
      reconnecting: ["pending", "弱网重连中…修改已本地保存"],
      error:        ["error",   "同步失败 · 点击重试"],
      off:          ["",        "同步未启动 · 点击开启"]
    };
    const m = map[status] || map.off;
    if (m[0]) chipEl.classList.add(m[0]);
    chipText.textContent = m[1] + (room ? "（房间 " + room + (outbox.length ? "，待传" + outbox.length + "条" : "") + "）" : "");
  }

  function bindUI() {
    chipEl = document.getElementById("syncChip");
    chipText = document.getElementById("syncText");
    popEl = document.getElementById("syncPop");
    roomInput = document.getElementById("syncRoomInput");
    roomInput.value = room || "";
    chipEl.addEventListener("click", () => { popEl.hidden = !popEl.hidden; roomInput.value = room || ""; });
    document.getElementById("syncApply").addEventListener("click", () => {
      const v = roomInput.value.trim().replace(/[^a-zA-Z0-9_-]/g, "").slice(0, 24);
      if (!v) { UIModule.show("warn", "请输入房间号（仅限字母、数字、-、_）。", true); return; }
      if (v !== room) {
        room = v;
        try { localStorage.setItem(ROOM_KEY, room); } catch (e) {}
        rev = 0; cellTs = {}; persistTs();
        reconnect();
      } else if (status === "off") {
        reconnect();   // 手动断开后，用相同房间号可重新开启同步
      }
      popEl.hidden = true;
    });
    document.getElementById("syncClose").addEventListener("click", () => { popEl.hidden = true; });
    document.getElementById("syncOff").addEventListener("click", () => {
      if (client) { try { client.end(true); } catch (e) {} client = null; }
      setStatus("off");
      popEl.hidden = true;
    });
    window.addEventListener("online", () => { if (room && status !== "online") reconnect(); drainSoon(); });
  }

  // ---------- 动态加载 mqtt.js（CDN 依次回退） ----------
  function loadMqtt(done) {
    if (window.mqtt) { done(); return; }
    let i = 0;
    (function next() {
      if (i >= CDNS.length) { setStatus("error"); UIModule.show("error", "同步组件加载失败（CDN 不可达），本地功能不受影响，可稍后重试。", true); return; }
      const s = document.createElement("script");
      s.src = CDNS[i++];
      s.onload = done;
      s.onerror = () => { s.remove(); next(); };
      document.head.appendChild(s);
    })();
  }

  // ---------- 连接管理 ----------
  // 房间号哈希 + 5 分钟确定性时间桶选择中继节点：
  // 所有设备按同一时钟同步换节点，既保证同房间不分散（防消息隔离），
  // 又能在某个节点宕机/封禁时于数分钟内全网自动迁移，不会永久卡死在一个节点。
  function nodeForRoom() {
    let h = 0;
    for (let i = 0; i < room.length; i++) h = (h * 31 + room.charCodeAt(i)) >>> 0;
    return (h + Math.floor(Date.now() / 300000)) % BROKERS.length;
  }

  function reconnect() {
    if (client) { try { client.end(true); } catch (e) {} client = null; }
    stuckSince = 0;
    connect();
  }

  function connect() {
    if (!room || (client && client.connected)) return;
    setStatus("connecting");
    loadMqtt(() => {
      if (!room) return;
      brokerIdx = nodeForRoom();
      const url = BROKERS[brokerIdx];
      client = mqtt.connect(url, {
        clientId: "gdrep_" + DEV + "_" + Math.random().toString(36).slice(2, 6),
        clean: false,                       // 持久会话：短暂掉线期间 QoS1 消息由 broker 补投
        keepalive: 30,
        reconnectPeriod: 5000,
        connectTimeout: 8000,
        protocolVersion: 4
      });
      client.on("connect", () => {
        setStatus("online");
        stuckSince = 0;
        client.subscribe([T_S(), T_O(), T_H()], { qos: 1 }, () => {});
        drainSoon();
        // retained 快照由订阅重放；再广播 hello 请求一次兜底
        setTimeout(() => { if (client && client.connected) pub(T_H(), { dev: DEV, ts: Date.now() }); }, 400);
      });
      client.on("reconnect", () => setStatus("reconnecting"));
      client.on("close", () => { if (status === "online") setStatus("reconnecting"); });
      client.on("offline", () => setStatus("reconnecting"));
      client.on("error", () => { /* mqtt.js 自动重试当前节点；节点级故障由时间桶轮换与看门狗兜底 */ });
      client.on("message", onMessage);
    });
  }

  // 连接可靠性看门狗（15 秒一查）：
  // ① 连接中/重连中持续超 60 秒 → 强制销毁重建（换新 clientId，防中继防抖封禁卡死）
  // ② 已连接但当前应处的节点已随时间桶变化 → 全网设备同步迁移到新节点
  setInterval(() => {
    if (!room || status === "off") return;
    if (status === "online") {
      if (client && client.connected && nodeForRoom() !== brokerIdx) reconnect();
      return;
    }
    if (!client) {   // client 为空且不在 off/error：loadMqtt 失败或连接流程中断 → 重新拉起
      if (status === "connecting" || status === "reconnecting") { stuckSince = stuckSince || Date.now(); if (Date.now() - stuckSince > 60000) reconnect(); }
      return;
    }
    if (status === "connecting" || status === "reconnecting") {
      stuckSince = stuckSince || Date.now();
      if (Date.now() - stuckSince > 60000) reconnect();
    } else stuckSince = 0;
  }, 15000);

  // ---------- 发布 ----------
  function pub(topic, obj, opts, cb) {
    if (!client || !client.connected) return false;
    try {
      client.publish(topic, JSON.stringify(obj), Object.assign({ qos: 1 }, opts || {}), cb || function () {});
      return true;
    } catch (e) { return false; }
  }

  function buildState() {
    let model = [];
    try { model = JSON.parse(localStorage.getItem("report_structure_v1") || "[]") || []; } catch (e) {}
    let hf = {};
    try {
      const snap = JSON.parse(localStorage.getItem("report_autosave_v1") || "{}") || {};
      Object.keys(snap).forEach(k => { if (k[0] === "h" || k[0] === "f") hf[k] = snap[k]; });
    } catch (e) {}
    return { v: 1, dev: DEV, ts: Date.now(), rev: rev, model: model, hf: hf, cellTs: cellTs };
  }

  function enqueue(item) { outbox.push(item); persistOutbox(); }

  function drainSoon() { setTimeout(drain, 150); }

  // 逐条补传；QoS1 由中继保证送达。增量消息发后即确认（回调丢失不致卡死），
  // 快照消息等确认，另加 5 秒看门狗防回调丢失卡住队列
  function drain() {
    if (!client || !client.connected || draining) return;
    draining = true;
    const watchdog = setTimeout(() => { draining = false; }, 5000);
    (function step() {
      if (!outbox.length || !client.connected) { draining = false; clearTimeout(watchdog); persistOutbox(); return; }
      const item = outbox[0];
      if (item.kind === "state") {
        rev = Math.max(rev, item.rev || 0);
        const ok = pub(T_S(), buildState(), { retain: true }, function (err) {
          if (err) { draining = false; clearTimeout(watchdog); setStatus("reconnecting"); return; }
          if (outbox[0] === item) { outbox.shift(); persistOutbox(); }
          step();
        });
        if (!ok) { draining = false; clearTimeout(watchdog); return; }
      } else {
        const ok = pub(T_O(), { kind: "cells", dev: DEV, ops: item.ops }, {});
        if (!ok) { draining = false; clearTimeout(watchdog); return; }
        outbox.shift(); persistOutbox(); step();
      }
    })();
  }

  // ---------- 本地变更出站（由 AutoSaveApp 在本地落盘后调用） ----------
  function publishCellOps(batch) {
    const now = Date.now();
    const ops = [];
    batch.forEach((v, k) => { cellTs[k] = now; ops.push({ k: k, v: String(v), ts: now }); });
    persistTsSoon();
    enqueue({ kind: "cells", ops: ops });
    drain();
  }

  // 本地结构操作后发布整快照（retained）
  function publishStructure() {
    rev++;
    enqueue({ kind: "state", rev: rev });
    drain();
  }

  // ---------- 远端变更入站 ----------
  function onMessage(topic, payload) {
    let msg;
    try { msg = JSON.parse(payload.toString()); } catch (e) { return; }
    if (!msg || msg.dev === DEV) return;   // 忽略自己发布的
    if (topic === T_O()) {
      if (msg.kind === "cells" && Array.isArray(msg.ops)) applyRemoteCells(msg.ops);
    } else if (topic === T_S()) {
      queueState(msg);
    } else if (topic === T_H()) {
      // 新设备请求状态：抖动延迟回复，期间若已收到快照则自动跳过（防风暴）
      setTimeout(() => { if (client && client.connected && rev >= 0) pub(T_S(), buildState(), {}, function () {}); },
        200 + Math.random() * 600);
    }
  }

  function isEditing() {
    const a = document.activeElement;
    return !!(a && a.isContentEditable && a.closest && a.closest("#tableBody, .foot-notes"));
  }

  function queueState(st) {
    if (isEditing()) { pendingState = st; return; }   // 正在编辑 → 失焦后再应用
    applyRemoteState(st);
  }

  // 应用远端单元格增量（LWW：仅接受更新的时间戳）
  function applyRemoteCells(ops) {
    let dirtyModel = false, any = false;
    ops.forEach(op => {
      if (!op || !op.k || typeof op.ts !== "number") return;
      if ((cellTs[op.k] || 0) >= op.ts) return;      // 本地已更新或相等 → 忽略旧值
      cellTs[op.k] = op.ts;
      any = true;
      const el = document.querySelector('[data-cid="' + op.k + '"]');
      if (el && document.activeElement === el) return;  // 正在编辑该格：不覆盖，待快照周期收敛
      if (el) {
        el.innerText = String(op.v == null ? "" : op.v);
        el.classList.remove("as-pending", "as-saving", "as-error");
        el.classList.add("as-saved");                // 绿闪：该格被其他设备更新
      }
      if (op.k[0] === "h" || op.k[0] === "f") {
        if (op.k[0] === "h") TableModule.setHeaderField(op.k, op.v);   // 远端表头变更同步写入模型，避免 render 覆盖
        try {
          const snap = JSON.parse(localStorage.getItem("report_autosave_v1") || "{}") || {};
          snap[op.k] = String(op.v == null ? "" : op.v);
          localStorage.setItem("report_autosave_v1", JSON.stringify(snap));
        } catch (e) {}
      } else if (TableModule.applyCellKey(op.k, op.v, true)) {
        dirtyModel = true;
      }
    });
    if (any) persistTsSoon();
    if (dirtyModel) TableModule.refresh();
  }

  // 应用远端整快照（结构同步 / 首次加入 / 兜底收敛），按时间戳逐格合并防覆盖
  async function applyRemoteState(st) {
    try {
      if (!st || st.v !== 1 || !Array.isArray(st.model) || !st.model.length) return;
      try { await AutoSaveApp.flushAndSettle(); } catch (e) {}   // 先把本地未保存内容落盘并广播
      if (isEditing()) { pendingState = st; return; }
      const inTs = st.cellTs || {};
      const localModel = flatLocal();          // 采纳前先平铺记录本地值
      rev = Math.max(rev, st.rev || 0) + 1;

      // 结构不同 → 采纳远端结构；随后把本地较新的单元格值覆盖回去
      let adopted = false;
      if (JSON.stringify(st.model) !== localStorage.getItem("report_structure_v1")) {
        TableModule.adoptModel(st.model);
        AutoSaveApp.afterStructureChange();
        adopted = true;
      }
      // 逐格合并：远端较新 → 取远端；本地较新 → 保留并回播给对方
      const backOps = [];
      const now = Date.now();
      localModel.forEach((rec, k) => {
        if ((inTs[k] || 0) >= rec.ts) return;  // 远端更新或相等 → 保持远端值
        TableModule.applyCellKey(k, rec.v, true);
        cellTs[k] = Math.max(rec.ts, inTs[k] || 0);
        backOps.push({ k: k, v: rec.v, ts: cellTs[k] });
      });
      // 本地较新的表头/备注也回播
      try {
        const snap = JSON.parse(localStorage.getItem("report_autosave_v1") || "{}") || {};
        Object.keys(snap).forEach(k => {
          if (k[0] !== "h" && k[0] !== "f") return;
          const ts = cellTs[k] || now;
          if ((inTs[k] || 0) >= ts) return;
          cellTs[k] = ts;
          backOps.push({ k: k, v: String(snap[k] == null ? "" : snap[k]), ts: ts });
        });
      } catch (e) {}
      persistTs();
      TableModule.refresh();
      // 远端较新的表头/备注：统一走增量应用（写 DOM + 本地暂存 + 绿闪提示）
      const remoteOps = [];
      Object.keys(inTs).forEach(k => {
        if (k[0] !== "h" && k[0] !== "f" || localModel.has(k)) return;
        if ((cellTs[k] || 0) >= inTs[k]) return;
        remoteOps.push({ k: k, v: (st.hf && st.hf[k] != null) ? st.hf[k] : "", ts: inTs[k] });
      });
      // 远端较新的数据区单元格：结构相同未采纳模型时，从快照模型取值应用。
      // 没有这一步，错过的增量消息将永远无法被快照治愈（双端数据不一致的根源之一）。
      if (!adopted) {
        const valMap = {};
        st.model.forEach(g => {
          for (let i = 0; i < 5; i++) valMap[g.id + ".p." + i] = g[["no", "item", "name", "draw", "qty"][i]] || "";
          (g.steps || []).forEach(s => {
            for (let i = 0; i < 10; i++) valMap[g.id + "." + s.id + "." + i] = s[["step", "line", "mac", "takt", "done", "note", "worker", "total", "tool", "life"][i]] || "";
          });
        });
        Object.keys(inTs).forEach(k => {
          if (k[0] === "h" || k[0] === "f" || !(k in valMap)) return;
          if ((cellTs[k] || 0) >= inTs[k]) return;
          remoteOps.push({ k: k, v: valMap[k], ts: inTs[k] });
        });
      } else {
        // 已采纳模型：数据区值已随模型就位，补齐时间戳防同刻增量被重复接受
        Object.keys(inTs).forEach(k => {
          if (k[0] === "h" || k[0] === "f") return;
          if ((cellTs[k] || 0) < inTs[k]) cellTs[k] = inTs[k];
        });
      }
      if (remoteOps.length) applyRemoteCells(remoteOps);
      if (backOps.length) { enqueue({ kind: "cells", ops: backOps }); drain(); }
    } catch (e) {
      console.error("[Sync] 应用远端快照失败：", e);
    }
  }

  // 平铺本地模型为 {cid: {v, ts}}（同步合并用）
  function flatLocal() {
    const m = new Map();
    let model = [];
    try { model = JSON.parse(localStorage.getItem("report_structure_v1") || "[]") || []; } catch (e) {}
    model.forEach(g => {
      for (let i = 0; i < 5; i++) {
        const k = g.id + ".p." + i;
        m.set(k, { v: g[["no", "item", "name", "draw", "qty"][i]] || "", ts: cellTs[k] || 0 });
      }
      (g.steps || []).forEach(s => {
        for (let i = 0; i < 10; i++) {
          const k = g.id + "." + s.id + "." + i;
          m.set(k, { v: s[["step", "line", "mac", "takt", "done", "note", "worker", "total", "tool", "life"][i]] || "", ts: cellTs[k] || 0 });
        }
      });
    });
    return m;
  }

  // 注：不做周期性 retained 快照重发——数据陈旧的设备会把房间快照污染回旧值，
  // 导致其他设备刷新后采纳到陈旧数据（"刷新后重置为初始值"的放大器）。
  // 兜底恢复由 hello/ack 应答（非 retained，接收方按 ts 合并）+ retained 结构快照承担。

  function init() {
    bindUI();
    paintChip();
    if (room) connect(); else setStatus("off");
    document.addEventListener("focusout", () => {
      if (pendingState && !isEditing()) { const st = pendingState; pendingState = null; applyRemoteState(st); }
    });
    // 手机切后台/锁屏会挂起 WebSocket，回前台时主动恢复连接并补传离线队列
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !room) return;
      if (!client) { if (status !== "off" && status !== "error") reconnect(); return; }
      if (!client.connected) { if (!client.reconnecting) reconnect(); }
      else drainSoon();
    });
  }

  return {
    init: init,
    getState: getState,
    onStatusChange: onStatusChange,
    publishCellOps: publishCellOps,
    publishStructure: publishStructure,
    _dbg: function () {   // 测试诊断口
      return {
        status: status, room: room, rev: rev, outbox: outbox.length,
        broker: BROKERS[brokerIdx] || "", dev: DEV,
        tsKeys: Object.keys(cellTs).length
      };
    }
  };
})();

/* ================================================================
 * 模块八：图片识别导入（ImageImportModule）
 * 职责：上传图片（格式/大小校验）→ 本地预处理 → Tesseract.js OCR
 *       （chi_sim+eng，CDN 多级回退）→ 行列结构解析 → 字段自动匹配 →
 *       预览确认（可编辑、可调整列映射）→ 经 adoptModel/publishCellOps/
 *       publishStructure 写入报表（自动保存与多端同步链路复用）
 * 识别全部在浏览器本地完成，图片不上传服务器；首次使用需联网下载识别模型。
 * ================================================================ */
const ImageImportModule = (() => {
  const TESS_CDNS = [
    "https://registry.npmmirror.com/tesseract.js/5.1.1/files/dist/tesseract.min.js",
    "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js",
    "https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"
  ];
  const LANG_FALLBACKS = [null, "https://registry.npmmirror.com/-/binary/tessdata/4.0.0"];
  const MAX_SIZE = 10 * 1024 * 1024;
  const OK_TYPES = /^image\/(jpe?g|png|webp|bmp)$/i;
  const OK_EXT = /\.(jpe?g|png|webp|bmp)$/i;
  const STEP_KEY_LIST = ["step", "line", "mac", "takt", "done", "note", "worker", "total", "tool", "life"];
  const FIELDS = [
    { key: "p.no", label: "项目序号" }, { key: "p.item", label: "件号" },
    { key: "p.name", label: "产品名称" }, { key: "p.draw", label: "图号" },
    { key: "p.qty", label: "本批数量" }, { key: "s.step", label: "工序名称" },
    { key: "s.line", label: "生产线" }, { key: "s.mac", label: "机床编号" },
    { key: "s.takt", label: "加工节拍" }, { key: "s.done", label: "当班完成" },
    { key: "s.note", label: "进度及异常" }, { key: "s.worker", label: "加工人员" },
    { key: "s.total", label: "累计完成数量" }, { key: "s.tool", label: "使用刀具型号" },
    { key: "s.life", label: "刀具寿命" }
  ];
  const HEAD_HINTS = [
    ["序号|^序$", "p.no"], ["件号|件名|零件|项目", "p.item"], ["名称|品名", "p.name"],
    ["图号", "p.draw"], ["数量|件数", "p.qty"], ["工序|工步", "s.step"],
    ["生产线|线别", "s.line"], ["机床|机台|设备", "s.mac"], ["节拍", "s.takt"],
    ["当班完成|当班", "s.done"], ["异常|备注|进度", "s.note"], ["加工人员|人员|工人|操作", "s.worker"],
    ["累计", "s.total"], ["刀具型号|刀具", "s.tool"], ["寿命", "s.life"]
  ].map(([re, key]) => [new RegExp(re), key]);
  const NUM_KEYS = { "p.qty": 1, "s.done": 1, "s.total": 1, "s.takt": 1, "p.no": 1 };

  let els = {}, parsed = null, busy = false, workerSeq = 0;

  function $(id) { return document.getElementById(id); }
  function show(msg, isErr) { els.progress.textContent = msg; els.progress.classList.toggle("err", !!isErr); }
  function progress(p) { els.bar.hidden = false; els.barFill.style.width = Math.round(Math.min(1, p) * 100) + "%"; }

  // ---------- 文件校验 ----------
  function validateFile(file) {
    if (!file) return "未选择文件。";
    if (!(OK_TYPES.test(file.type || "") || OK_EXT.test(file.name || "")))
      return "不支持的文件格式：仅支持 JPG / JPEG / PNG / WEBP / BMP 图片。";
    if (file.size > MAX_SIZE)
      return "图片超过 10MB 限制（当前 " + (file.size / 1048576).toFixed(1) + "MB），请压缩后重试。";
    return null;
  }

  // ---------- 预处理：缩放到 1600~2400px 宽、灰度、对比度拉伸、抹除表格线 ----------
  function preprocess(dataURL) {
    return new Promise((resolve, reject) => {
      const im = new Image();
      im.onload = () => {
        try {
          const scale = Math.min(2400, Math.max(1600, im.width)) / im.width;
          const c = document.createElement("canvas");
          c.width = Math.max(1, Math.round(im.width * scale));
          c.height = Math.max(1, Math.round(im.height * scale));
          const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, c.width, c.height);   // 白底合成：防 PNG 透明区在灰度化后变黑块
          ctx.drawImage(im, 0, 0, c.width, c.height);
          const d = ctx.getImageData(0, 0, c.width, c.height);
          const px = d.data;
          let mn = 255, mx = 0;
          for (let i = 0; i < px.length; i += 4) {
            const g = 0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2];
            px[i] = px[i + 1] = px[i + 2] = g;
            if (g < mn) mn = g;
            if (g > mx) mx = g;
          }
          const range = Math.max(1, mx - mn);
          for (let i = 0; i < px.length; i += 4) {
            const v = Math.round((px[i] - mn) * 255 / range);
            px[i] = px[i + 1] = px[i + 2] = v;
          }
          // 关键：表格线会破坏 Tesseract 版面分析（实测：线内文字全部变成拉丁乱码幻觉），必须先抹除
          removeGridLines(px, c.width, c.height);
          ctx.putImageData(d, 0, 0);
          resolve(splitBands(c));
        } catch (e) { reject(new Error("图片处理失败")); }
      };
      im.onerror = () => reject(new Error("图片解码失败，文件可能已损坏。"));
      im.src = dataURL;
    });
  }

  // 超高图分带：高 >1800 时按 1600 高、140 重叠横切，避免 Tesseract 对超长图卡死
  function splitBands(c) {
    const BAND_H = 1600, OVERLAP = 140;
    if (c.height <= 1800) return [{ url: c.toDataURL("image/png"), yOff: 0 }];
    const bands = [];
    for (let y = 0; y < c.height; y += BAND_H - OVERLAP) {
      const h = Math.min(BAND_H, c.height - y);
      const b = document.createElement("canvas");
      b.width = c.width; b.height = h;
      const bctx = b.getContext("2d");
      bctx.drawImage(c, 0, y, c.width, h, 0, 0, c.width, h);
      bands.push({ url: b.toDataURL("image/png"), yOff: y });
      if (y + h >= c.height) break;
    }
    return bands;
  }

  // 抹除表格线：连续墨迹（容差 2px 缺口）横贯 >35% 宽度或纵贯 >6% 高度即判定为表格线
  function removeGridLines(px, W, H) {
    const GAP = 2, hThresh = W * 0.35, vThresh = Math.max(60, H * 0.06);
    const white = o => { px[o] = px[o + 1] = px[o + 2] = 255; };
    for (let y = 0; y < H; y++) {
      const base = y * W * 4;
      let run = 0, start = 0, gap = 0;
      const flush = () => { if (run > hThresh) for (let k = start; k < start + run; k++) white(base + k * 4); };
      for (let x = 0; x < W; x++) {
        if (px[base + x * 4] < 128) { if (run === 0) start = x; run += gap + 1; gap = 0; }
        else { gap++; if (gap > GAP) { flush(); run = 0; gap = 0; } }
      }
      flush();
    }
    for (let x = 0; x < W; x++) {
      let run = 0, start = 0, gap = 0;
      const flush = () => { if (run > vThresh) for (let k = start; k < start + run; k++) white((k * W + x) * 4); };
      for (let y = 0; y < H; y++) {
        if (px[(y * W + x) * 4] < 128) { if (run === 0) start = y; run += gap + 1; gap = 0; }
        else { gap++; if (gap > GAP) { flush(); run = 0; gap = 0; } }
      }
      flush();
    }
  }

  // ---------- OCR（CDN 多级回退 + 语言包回退） ----------
  function loadTesseract() {
    if (window.Tesseract) return Promise.resolve();
    return new Promise((resolve, reject) => {
      let i = 0;
      (function next() {
        if (i >= TESS_CDNS.length) { reject(new Error("识别组件加载失败（CDN 不可达）")); return; }
        const s = document.createElement("script");
        s.src = TESS_CDNS[i++];
        s.onload = () => resolve();
        s.onerror = () => { s.remove(); next(); };
        document.head.appendChild(s);
      })();
    });
  }

  // 从 OCR 结果中提取扁平词表（blocks → paragraphs → lines → words 逐级回退）
  function extractWords(res) {
    const data = (res && res.data) || {};
    const out = [];
    const push = w => { if (w && w.text && w.text.trim() && w.bbox) out.push({ text: w.text.trim(), bbox: w.bbox }); };
    if (Array.isArray(data.blocks)) data.blocks.forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => (l.words || []).forEach(push))));
    if (!out.length && Array.isArray(data.lines)) data.lines.forEach(l => (l.words || []).forEach(push));
    if (!out.length && Array.isArray(data.words)) data.words.forEach(push);
    return out;
  }

  async function recognize(bands, seq) {
    await loadTesseract();
    let lastErr = null;
    for (let li = 0; li < LANG_FALLBACKS.length; li++) {
      if (seq !== workerSeq) throw new Error("已取消");
      try {
        const allWords = [], texts = [], seen = {};
        for (let bi = 0; bi < bands.length; bi++) {
          if (seq !== workerSeq) throw new Error("已取消");
          const band = bands[bi], multi = bands.length > 1;
          const base = bi / bands.length, span = 1 / bands.length;
          const opts = {
            logger: m => {
              if (seq !== workerSeq || !m) return;
              if (m.status === "recognizing text") progress(base + (m.progress || 0) * span);
              else if (typeof m.progress === "number") progress((base + m.progress * span) * 0.9);
              if (m.status) show("识别中" + (multi ? "（分带 " + (bi + 1) + "/" + bands.length + "）" : "") + "：" + m.status + "…（首次使用需下载中文模型，请耐心等待）");
            }
          };
          if (LANG_FALLBACKS[li]) opts.langPath = LANG_FALLBACKS[li];
          const res = await window.Tesseract.recognize(band.url, "chi_sim+eng", opts, { text: true, blocks: true });
          if (seq !== workerSeq) throw new Error("已取消");
          texts.push((res && res.data && res.data.text) || "");
          extractWords(res).forEach(w => {
            const y0 = w.bbox.y0 + band.yOff, y1 = w.bbox.y1 + band.yOff;
            // 分带重叠区去重：同一物理词在相邻两带各出现一次，按 (文本,x,y) 模糊键去重
            const key = w.text + "|" + Math.round(w.bbox.x0 / 8) + "|" + Math.round(y0 / 8);
            if (seen[key]) return;
            seen[key] = 1;
            allWords.push({ text: w.text, bbox: { x0: w.bbox.x0, y0: y0, x1: w.bbox.x1, y1: y1 } });
          });
        }
        return { data: { text: texts.join("\n"), words: allWords } };
      } catch (e) {
        if (e && e.message === "已取消") throw e;
        lastErr = e;
      }
    }
    throw lastErr || new Error("识别失败");
  }

  // ---------- 解析：词 → 行（y 聚类） → 列（x 间距） ----------
  function collectWords(res) {
    const data = (res && res.data) || {};
    const words = [];
    const push = w => {
      if (!w || !w.text || !w.text.trim() || !w.bbox) return;
      words.push({ t: w.text.trim(), x0: w.bbox.x0, x1: w.bbox.x1,
                   y: (w.bbox.y0 + w.bbox.y1) / 2, h: Math.max(1, w.bbox.y1 - w.bbox.y0) });
    };
    if (Array.isArray(data.blocks)) {
      data.blocks.forEach(b => (b.paragraphs || []).forEach(p => (p.lines || []).forEach(l => (l.words || []).forEach(push))));
    }
    if (!words.length && Array.isArray(data.lines)) data.lines.forEach(l => (l.words || []).forEach(push));
    if (!words.length && Array.isArray(data.words)) data.words.forEach(push);
    return words;
  }

  // y 聚类成行：返回每行的词数组（行内按 x 排序）与中位字高
  function clusterLines(words) {
    if (!words.length) return { lines: [], medH: 12 };
    const ws = words.slice().sort((a, b) => a.y - b.y);
    const hs = ws.map(w => w.h).sort((a, b) => a - b);
    const medH = hs[Math.floor(hs.length / 2)] || 12;
    const lines = [];
    let cur = [ws[0]];
    for (let i = 1; i < ws.length; i++) {
      if (Math.abs(ws[i].y - cur[cur.length - 1].y) <= medH * 0.7) cur.push(ws[i]);
      else { lines.push(cur); cur = [ws[i]]; }
    }
    lines.push(cur);
    lines.forEach(l => l.sort((a, b) => a.x0 - b.x0));
    return { lines: lines, medH: medH };
  }

  // 单行内按 x 间距切列（无表头时的回退方案）
  function lineToCols(line, medH) {
    const cols = [];
    let col = [line[0]];
    for (let i = 1; i < line.length; i++) {
      if (line[i].x0 - col[col.length - 1].x1 > medH * 0.9) { cols.push(col); col = [line[i]]; }
      else col.push(line[i]);
    }
    cols.push(col);
    return cols.map(g => g.map(w => w.t).join(" "));
  }

  function textToRows(text) {
    return String(text || "").split(/\n+/)
      .map(l => l.trim()).filter(l => l)
      .map(l => l.split(/\s{2,}|\t+/).map(s => s.trim()));
  }

  function guessField(text) {
    // chi_sim 常把中文表头逐字输出（如"件 号"），匹配前必须去掉空白
    const t = String(text || "").replace(/\s+/g, "");
    for (let i = 0; i < HEAD_HINTS.length; i++) if (HEAD_HINTS[i][0].test(t)) return HEAD_HINTS[i][1];
    return null;
  }

  function buildParsed(res) {
    const words = collectWords(res);
    let rows = [], map = null, hasHeader = false, headerNames = null;
    if (words.length) {
      const cl = clusterLines(words);
      const lines = cl.lines, medH = cl.medH;
      // 表头锚点列：前 3 行中逐词命中 ≥2 个不同字段的行视为表头
      let hIdx = -1;
      for (let r = 0; r < Math.min(3, lines.length); r++) {
        const fs = {};
        lines[r].forEach(w => { const f = guessField(w.t); if (f) fs[f] = 1; });
        if (Object.keys(fs).length >= 2) { hIdx = r; break; }
      }
      if (hIdx >= 0) {
        // 表头词按 x 间距聚成列锚；数据行的每个词按 x 中心归入最近锚点列。
        // 表格线抹除后词间切列不再可靠（表头碎裂与数据行错位），锚点方案以表头位置为基准对齐。
        hasHeader = true;
        const hw = lines[hIdx];
        const groups = [];
        let cur = [hw[0]];
        for (let i = 1; i < hw.length; i++) {
          if (hw[i].x0 - cur[cur.length - 1].x1 > medH * 1.0) { groups.push(cur); cur = [hw[i]]; }
          else cur.push(hw[i]);
        }
        groups.push(cur);
        const anchors = groups.map(g => ({
          text: g.map(w => w.t).join(""),
          field: guessField(g.map(w => w.t).join(" ")),
          cx: (g[0].x0 + g[g.length - 1].x1) / 2
        }));
        map = anchors.map(a => a.field);
        headerNames = anchors.map(a => a.text);   // 保留表头原文作为预览列名
        for (let r = hIdx + 1; r < lines.length; r++) {
          const rowArr = [];
          for (let c = 0; c < anchors.length; c++) rowArr.push("");
          lines[r].forEach(w => {
            const wx = (w.x0 + w.x1) / 2;
            let best = 0, bd = Infinity;
            for (let c = 0; c < anchors.length; c++) {
              const d = Math.abs(anchors[c].cx - wx);
              if (d < bd) { bd = d; best = c; }
            }
            rowArr[best] = rowArr[best] ? rowArr[best] + " " + w.t : w.t;
          });
          rows.push(rowArr);
        }
      } else {
        // 无表头回退：每行独立按 x 间距切列，按位置映射 s.*
        rows = lines.map(l => lineToCols(l, medH));
      }
    } else {
      rows = textToRows((res && res.data && res.data.text) || "");
    }
    rows = rows.map(r => r.map(t => String(t == null ? "" : t).trim())).filter(r => r.some(t => t));
    if (rows.length > 200) rows = rows.slice(0, 200);
    if (!map) map = rows.length ? rows[0].map((_, i) => (i < STEP_KEY_LIST.length ? "s." + STEP_KEY_LIST[i] : null)) : [];
    const colCount = Math.max.apply(null, rows.map(r => r.length).concat([map.length]));
    for (let i = map.length; i < colCount; i++) map.push(null);
    rows.forEach(r => { while (r.length < colCount) r.push(""); });
    return { rows: rows, map: map, hasHeader: hasHeader, headerNames: headerNames };
  }

  // ---------- 预览渲染 ----------
  function renderPreview() {
    const colCount = parsed.map.length;
    // 列映射下拉
    els.mapRow.innerHTML = "";
    parsed.map.forEach((key, ci) => {
      const wrap = document.createElement("span");
      wrap.className = "img-map-item";
      const lab = document.createElement("span");
      lab.textContent = (parsed.headerNames && parsed.headerNames[ci] ? parsed.headerNames[ci] : "第" + (ci + 1) + "列") + " →";
      const sel = document.createElement("select");
      sel.dataset.ci = ci;
      sel.appendChild(new Option("忽略", ""));
      FIELDS.forEach(f => sel.appendChild(new Option(f.label, f.key)));
      sel.value = key || "";
      sel.addEventListener("change", () => {
        const v = sel.value;
        if (v) parsed.map.forEach((k, i) => { if (i !== Number(sel.dataset.ci) && k === v) parsed.map[i] = ""; });
        parsed.map[Number(sel.dataset.ci)] = v;
        renderPreview();
      });
      wrap.appendChild(lab);
      wrap.appendChild(sel);
      els.mapRow.appendChild(wrap);
    });
    els.mapRow.hidden = false;
    // 表头
    els.gridHead.innerHTML = "<tr><th>#</th>" +
      parsed.map.map((k, ci) => {
        const f = FIELDS.find(x => x.key === k);
        const name = parsed.headerNames && parsed.headerNames[ci] ? parsed.headerNames[ci] : "第" + (ci + 1) + "列";
        return "<th>" + name + (f ? " → " + f.label : "") + "</th>";
      }).join("") + "</tr>";
    // 数据行（可编辑）
    els.gridBody.innerHTML = "";
    parsed.rows.forEach((row, ri) => {
      const tr = document.createElement("tr");
      const idx = document.createElement("td");
      idx.textContent = ri + 1;
      tr.appendChild(idx);
      row.forEach((val, ci) => {
        const td = document.createElement("td");
        if (!parsed.map[ci]) td.className = "ignored";
        const input = document.createElement("input");
        input.type = "text";
        input.value = val;
        input.dataset.r = ri;
        input.dataset.c = ci;
        input.disabled = !parsed.map[ci];
        td.appendChild(input);
        tr.appendChild(td);
      });
      els.gridBody.appendChild(tr);
    });
    els.gridWrap.hidden = false;
    els.confirm.disabled = parsed.rows.length === 0;
  }

  // ---------- 应用写入（复用自动保存 + 多端同步链路） ----------
  async function applyParsed() {
    if (!parsed || !parsed.rows.length || busy) return;
    const mode = (els.modeCur.checked && TableModule.canOperate()) ? "current" : "new";
    if (els.modeCur.checked && !TableModule.canOperate()) {
      show("未选中项目：请先在报表中点击一个项目数据行，或改选「追加为新项目」。", true);
      return;
    }
    busy = true;
    els.confirm.disabled = true;
    try {
      show("正在写入报表…");
      await AutoSaveApp.flushAndSettle();
      let model;
      try { model = JSON.parse(localStorage.getItem("report_structure_v1") || "[]") || []; } catch (e) { model = []; }
      if (!Array.isArray(model) || !model.length) throw new Error("报表数据异常，无法写入。");

      const fields = parsed.map;
      const get = (r, key) => {
        for (let c = 0; c < fields.length; c++) if (fields[c] === key) return String(parsed.rows[r][c] || "").trim();
        return "";
      };
      const norm = (key, v) => NUM_KEYS[key] ? String(v).replace(/[^0-9.]/g, "") : v;
      // 逐行归组：项目字段变化即分组；仅当该行存在项目字段时才起新组
      const out = [];
      parsed.rows.forEach((_row, r) => {
        const pvals = {}, svals = {};
        FIELDS.forEach(f => {
          const v = norm(f.key, get(r, f.key));
          if (!v) return;
          if (f.key.charAt(0) === "p") pvals[f.key.slice(2)] = v;
          else svals[f.key.slice(2)] = v;
        });
        const sig = [pvals.no, pvals.item, pvals.name, pvals.draw, pvals.qty].join("|");
        let g = out[out.length - 1];
        if (!g || (sig.replace(/\|+$/, "") !== "" && sig !== g.__sig)) {
          g = { __sig: sig, item: "", name: "", draw: "", qty: "", steps: [] };
          out.push(g);
        }
        ["item", "name", "draw", "qty"].forEach(k => { if (pvals[k]) g[k] = pvals[k]; });
        if (Object.keys(svals).length) g.steps.push(svals);
        else if (g.steps.length === 0) g.steps.push({});
      });
      // 纵向合并单元格：项目文字只在中间行出现，其前的行会形成前导空项目组，并入后组
      while (out.length > 1 && ["item", "name", "draw", "qty"].every(k => !out[0][k])) {
        const lead = out.shift();
        out[0].steps = lead.steps.concat(out[0].steps);
      }
      out.forEach(g => delete g.__sig);
      if (!out.length) throw new Error("没有可写入的数据行。");
      if (mode === "current" && out.length > 1) out.splice(1);   // 写入当前项目时只取第一组

      // 收集本次写入的单元格键值（盖时间戳 + 增量广播，防远端旧值回灌）；只收集写入键，不动整表。
      // 注意：publishCellOps 只接受 Map（forEach(value,key) 语义），必须用 Map 不能用普通对象
      const vals = new Map();
      let stepCount = 0;
      const pKeys = { no: "p.0", item: "p.1", name: "p.2", draw: "p.3", qty: "p.4" };
      const collectGroup = g => {
        Object.keys(pKeys).forEach(k => { if (g[k]) vals.set(g.id + "." + pKeys[k], g[k]); });
        g.steps.forEach(s => STEP_KEY_LIST.forEach((k, i) => { if (s[k]) vals.set(g.id + "." + s.id + "." + i, s[k]); }));
      };
      if (mode === "new") {
        out.forEach(p => {
          const g = { id: TableModule.uid(), no: String(model.length + 1), item: p.item, name: p.name, draw: p.draw, qty: p.qty, steps: [] };
          p.steps.forEach(s => g.steps.push(Object.assign({ id: TableModule.uid() }, s)));
          if (!g.steps.length) g.steps.push({ id: TableModule.uid() });
          model.push(g);
          collectGroup(g);                    // 仅广播本次新增的组
          stepCount += g.steps.length;
        });
      } else {
        const loc = TableModule.locateCursor();
        if (!loc) throw new Error("未选中项目行。");
        const g = model[loc.g];
        const p0 = out[0];
        ["item", "name", "draw", "qty"].forEach(k => {
          if (p0[k]) { g[k] = p0[k]; vals.set(g.id + "." + pKeys[k], g[k]); }   // 仅广播实际覆盖的项目字段
        });
        p0.steps.forEach(s => {
          const ns = Object.assign({ id: TableModule.uid() }, s);
          g.steps.push(ns);
          STEP_KEY_LIST.forEach((k, i) => { if (ns[k]) vals.set(g.id + "." + ns.id + "." + i, ns[k]); });
          stepCount++;
        });
      }
      if (!TableModule.adoptModel(model)) throw new Error("数据格式校验未通过（存在空项目）。");
      AutoSaveApp.afterStructureChange();
      if (typeof SyncModule !== "undefined") {
        if (SyncModule.publishCellOps) SyncModule.publishCellOps(vals);
        if (SyncModule.publishStructure) SyncModule.publishStructure();
      }
      closeModal();
      UIModule.show("success", "图片识别导入完成：已写入 " + stepCount + " 个工序行" +
        (mode === "new" ? "（含 " + out.length + " 个新项目）" : "（写入当前选中项目）") + "。");
    } catch (e) {
      show("写入失败：" + (e && e.message ? e.message : "未知错误") + "。原有数据未受影响，可修正后重试。", true);
      els.confirm.disabled = false;
    } finally {
      busy = false;
    }
  }

  // ---------- 模态框与流程控制 ----------
  function closeModal() {
    workerSeq++;                      // 使在途识别回调失效
    els.modal.hidden = true;
  }

  async function openWithImage(dataURL) {
    els.modal.hidden = false;
    els.preview.src = dataURL;
    els.preview.hidden = false;
    els.mapRow.hidden = true;
    els.gridWrap.hidden = true;
    els.confirm.disabled = true;
    els.bar.hidden = true;
    parsed = null;
    workerSeq++;
    const seq = workerSeq;
    try {
      show("正在预处理图片…");
      const proc = await preprocess(dataURL);
      if (seq !== workerSeq) return;
      show("正在识别文字…（首次使用需下载中文识别模型，视网速可能需要数十秒）");
      const res = await recognize(proc, seq);
      if (seq !== workerSeq) return;
      parsed = buildParsed(res);
      if (!parsed.rows.length) {
        show("未能从图片中识别出有效内容。请使用更清晰、光线均匀的照片（文字方向请保持水平）后重试。", true);
        return;
      }
      renderPreview();
      show("识别完成：共 " + parsed.rows.length + " 行。请核对下表（可直接修改、可调整列映射），确认后写入。");
    } catch (e) {
      if (e && e.message === "已取消") return;
      show("识别失败：" + (e && e.message ? e.message : "未知错误") +
        "。请检查网络（首次使用需下载识别模型）后重试，或手动录入数据。", true);
    }
  }

  function init() {
    els = {
      modal: $("imgModal"), preview: $("imgPreview"), progress: $("imgProgress"),
      bar: $("imgBar"), barFill: $("imgBarFill"), mapRow: $("imgMapRow"),
      gridWrap: $("imgGridWrap"), gridHead: $("imgGridHead"), gridBody: $("imgGridBody"),
      confirm: $("imgConfirm"), modeCur: $("imgModeCur"), fileInput: $("imgFileInput")
    };
    $("btnImgImport").addEventListener("click", () => els.fileInput.click());
    $("imgRechoose").addEventListener("click", () => els.fileInput.click());
    $("imgCancel").addEventListener("click", closeModal);
    $("imgClose").addEventListener("click", closeModal);
    els.confirm.addEventListener("click", applyParsed);
    els.gridBody.addEventListener("input", e => {
      const t = e.target;
      if (t && t.dataset.r != null) parsed.rows[Number(t.dataset.r)][Number(t.dataset.c)] = t.value;
    });
    els.fileInput.addEventListener("change", () => {
      const file = els.fileInput.files && els.fileInput.files[0];
      els.fileInput.value = "";          // 允许重复选择同一文件
      const err = validateFile(file);
      if (err) { els.modal.hidden = false; els.preview.hidden = true; els.mapRow.hidden = true; els.gridWrap.hidden = true; els.confirm.disabled = true; show(err, true); return; }
      const reader = new FileReader();
      reader.onload = () => openWithImage(String(reader.result));
      reader.onerror = () => { els.modal.hidden = false; show("图片读取失败，请重试。", true); };
      reader.readAsDataURL(file);
    });
  }

  // 测试诊断口：_testFromDataURL 供自动化测试直接注入图片，跳过文件选择
  return {
    init: init,
    _testFromDataURL: function (dataURL) { return openWithImage(dataURL); },
    _dbg: function () { return { busy: busy, rows: parsed ? parsed.rows.length : 0, mapped: parsed ? parsed.map.filter(Boolean).length : 0 }; }
  };
})();

/* ================= 启动 ================= */
TableModule.init();
UIModule.bind();
AutoSaveApp.init();
SyncModule.init();
ImageImportModule.init();
</script>
</body>
</html>
