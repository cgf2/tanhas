<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>几何计算器</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #1a1a2e;
  color: #eee;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.container {
  max-width: 420px;
  margin: 0 auto;
  padding: 10px;
}
h1 {
  text-align: center;
  font-size: 1.1em;
  padding: 8px 0;
  color: #0f0;
  text-shadow: 0 0 10px rgba(0,255,0,0.3);
}
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  margin-bottom: 8px;
}
.tab {
  padding: 8px 2px;
  text-align: center;
  background: #16213e;
  border-radius: 6px;
  font-size: 0.7em;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid #0f3460;
}
.tab.active {
  background: #0f3460;
  color: #0f0;
  border-color: #0f0;
}
.tab-content { display: none; }
.tab-content.active { display: block; }

/* 显示屏 */
.display {
  background: #0a0a1a;
  border-radius: 8px;
  padding: 10px;
  margin-bottom: 8px;
  border: 1px solid #0f3460;
}
.display .expr {
  font-size: 0.75em;
  color: #888;
  min-height: 18px;
  word-break: break-all;
}
.display .result {
  font-size: 1.1em;
  color: #0f0;
  min-height: 28px;
  word-break: break-all;
  margin-top: 4px;
}

/* 输入区 */
.inputs {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 6px;
  margin-bottom: 8px;
}
.input-group {
  display: flex;
  flex-direction: column;
}
.input-group label {
  font-size: 0.65em;
  color: #aaa;
  margin-bottom: 2px;
}
.input-group input {
  background: #0a0a1a;
  border: 1.5px solid #0f3460;
  border-radius: 6px;
  padding: 8px 6px;
  color: #fff;
  font-size: 0.85em;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
  cursor: pointer;
}
.input-group input:focus {
  border-color: #0f0;
  box-shadow: 0 0 6px rgba(0,255,0,0.3);
}
.input-group input.readonly-highlight {
  border-color: #ff8800;
  box-shadow: 0 0 8px rgba(255,136,0,0.4);
}

/* 按钮面板 */
.btn-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 5px;
  margin-bottom: 8px;
}
.btn {
  background: #16213e;
  border: 1px solid #0f3460;
  border-radius: 8px;
  padding: 12px 4px;
  color: #eee;
  font-size: 0.85em;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  min-height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
}
.btn:active { transform: scale(0.95); background: #0f3460; }
.btn.num { background: #1a1a3e; font-weight: bold; font-size: 1em; }
.btn.op { background: #0f3460; color: #0ff; }
.btn.fn { background: #1a3a2e; color: #0f0; font-size: 0.75em; }
.btn.eq {
  background: #0f0;
  color: #000;
  font-weight: bold;
  font-size: 1em;
  grid-column: span 2;
}
.btn.clear { background: #3a1a1a; color: #f55; }
.btn.back { background: #3a2a1a; color: #fa0; }
.btn.const { background: #2a1a3a; color: #d0f; }

/* 特殊布局 */
.full-width { grid-column: span 2; }
.three-col { grid-template-columns: 1fr 1fr 1fr; }

@media (max-width: 380px) {
  .tabs { grid-template-columns: repeat(4, 1fr); }
  .tab { font-size: 0.6em; padding: 6px 1px; }
}
</style>
</head>
<body>
<div class="container">
  <h1>📐 几何计算器</h1>

  <div class="tabs">
    <div class="tab active" data-tab="ll">直线∩直线</div>
    <div class="tab" data-tab="cc">圆∩圆</div>
    <div class="tab" data-tab="lc">直线∩圆</div>
    <div class="tab" data-tab="tp">→极坐标</div>
    <div class="tab" data-tab="pt">→直角</div>
    <div class="tab" data-tab="3c">三点定圆</div>
    <div class="tab" data-tab="2r">两点+半径</div>
    <div class="tab" data-tab="len">直线长度</div>
  </div>

  <div class="display">
    <div class="expr" id="expr"></div>
    <div class="result" id="result">请输入数值</div>
  </div>

  <!-- 直线∩直线 -->
  <div class="tab-content active" id="tab-ll">
    <div class="inputs">
      <div class="input-group"><label>直线1 - P₁ x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="ll_p1x"></div>
      <div class="input-group"><label>P₁ y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="ll_p1y"></div>
      <div class="input-group"><label>P₂ x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="ll_p2x"></div>
      <div class="input-group"><label>P₂ y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="ll_p2y"></div>
      <div class="input-group"><label>直线2 - Q₁ x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="ll_q1x"></div>
      <div class="input-group"><label>Q₁ y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="ll_q1y"></div>
      <div class="input-group"><label>Q₂ x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="ll_q2x"></div>
      <div class="input-group"><label>Q₂ y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="ll_q2y"></div>
    </div>
  </div>

  <!-- 圆∩圆 -->
  <div class="tab-content" id="tab-cc">
    <div class="inputs">
      <div class="input-group"><label>圆1 - 圆心 x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="cc_c1x"></div>
      <div class="input-group"><label>圆心 y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="cc_c1y"></div>
      <div class="input-group"><label>半径 r</label><input type="text" inputmode="none" readonly class="calc-input" data-name="cc_r1"></div>
      <div class="input-group"><label>圆2 - 圆心 x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="cc_c2x"></div>
      <div class="input-group"><label>圆心 y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="cc_c2y"></div>
      <div class="input-group"><label>半径 r</label><input type="text" inputmode="none" readonly class="calc-input" data-name="cc_r2"></div>
    </div>
  </div>

  <!-- 直线∩圆 -->
  <div class="tab-content" id="tab-lc">
    <div class="inputs">
      <div class="input-group"><label>直线 - P x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="lc_px"></div>
      <div class="input-group"><label>P y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="lc_py"></div>
      <div class="input-group"><label>Q x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="lc_qx"></div>
      <div class="input-group"><label>Q y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="lc_qy"></div>
      <div class="input-group"><label>圆 - 圆心 x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="lc_cx"></div>
      <div class="input-group"><label>圆心 y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="lc_cy"></div>
      <div class="input-group"><label>半径 r</label><input type="text" inputmode="none" readonly class="calc-input" data-name="lc_r"></div>
    </div>
  </div>

  <!-- →极坐标 -->
  <div class="tab-content" id="tab-tp">
    <div class="inputs">
      <div class="input-group"><label>点 x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tp_x"></div>
      <div class="input-group"><label>点 y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tp_y"></div>
    </div>
  </div>

  <!-- →直角坐标 -->
  <div class="tab-content" id="tab-pt">
    <div class="inputs">
      <div class="input-group"><label>极径 ρ</label><input type="text" inputmode="none" readonly class="calc-input" data-name="pt_rho"></div>
      <div class="input-group"><label>极角 θ (°)</label><input type="text" inputmode="none" readonly class="calc-input" data-name="pt_theta"></div>
    </div>
  </div>

  <!-- 三点定圆 -->
  <div class="tab-content" id="tab-3c">
    <div class="inputs">
      <div class="input-group"><label>A x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tc_ax"></div>
      <div class="input-group"><label>A y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tc_ay"></div>
      <div class="input-group"><label>B x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tc_bx"></div>
      <div class="input-group"><label>B y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tc_by"></div>
      <div class="input-group"><label>C x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tc_cx"></div>
      <div class="input-group"><label>C y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tc_cy"></div>
    </div>
  </div>

  <!-- 两点+半径 -->
  <div class="tab-content" id="tab-2r">
    <div class="inputs">
      <div class="input-group"><label>P x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tr_px"></div>
      <div class="input-group"><label>P y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tr_py"></div>
      <div class="input-group"><label>Q x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tr_qx"></div>
      <div class="input-group"><label>Q y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tr_qy"></div>
      <div class="input-group"><label>半径 r</label><input type="text" inputmode="none" readonly class="calc-input" data-name="tr_r"></div>
    </div>
  </div>

  <!-- 直线长度 -->
  <div class="tab-content" id="tab-len">
    <div class="inputs">
      <div class="input-group"><label>起点 P x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="len_px"></div>
      <div class="input-group"><label>P y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="len_py"></div>
      <div class="input-group"><label>端点 Q x</label><input type="text" inputmode="none" readonly class="calc-input" data-name="len_qx"></div>
      <div class="input-group"><label>Q y</label><input type="text" inputmode="none" readonly class="calc-input" data-name="len_qy"></div>
      <div class="input-group"><label>长度 L（可编辑）</label><input type="text" inputmode="none" readonly class="calc-input" data-name="len_l" style="border-color:#ff8800;"></div>
    </div>
  </div>

  <!-- 数字按钮面板 -->
  <div class="btn-grid" id="keypad">
    <div class="btn clear" data-key="AC">AC</div>
    <div class="btn clear" data-key="C">C</div>
    <div class="btn back" data-key="BACK">⌫</div>
    <div class="btn op" data-key="±">±</div>

    <div class="btn num" data-key="7">7</div>
    <div class="btn num" data-key="8">8</div>
    <div class="btn num" data-key="9">9</div>
    <div class="btn fn" data-key="sin(">sin</div>

    <div class="btn num" data-key="4">4</div>
    <div class="btn num" data-key="5">5</div>
    <div class="btn num" data-key="6">6</div>
    <div class="btn fn" data-key="cos(">cos</div>

    <div class="btn num" data-key="1">1</div>
    <div class="btn num" data-key="2">2</div>
    <div class="btn num" data-key="3">3</div>
    <div class="btn fn" data-key="tan(">tan</div>

    <div class="btn num full-width" data-key="0">0</div>
    <div class="btn num" data-key=".">.</div>
    <div class="btn const" data-key="pi">π</div>

    <div class="btn const" data-key="sqrt(2)">√2</div>
    <div class="btn const" data-key="1/2">½</div>
    <div class="btn eq" data-key="=">= 计算</div>
  </div>
</div>

<script>
// ============ 核心变量 ============
let activeInput = null;
let currentTab = 'll';
let lastLength = null; // 直线长度面板用

// ============ 工具函数 ============
function parseExpr(expr) {
  if (expr === '' || expr === null || expr === undefined) return NaN;
  try {
    let e = expr.toString().trim();
    if (e === '') return NaN;
    e = e.replace(/π/g, 'pi');
    e = e.replace(/√2/g, 'Math.sqrt(2)');
    e = e.replace(/pi/g, 'Math.PI');
    e = e.replace(/sin\(/g, 'Math.sin(');
    e = e.replace(/cos\(/g, 'Math.cos(');
    e = e.replace(/tan\(/g, 'Math.tan(');
    e = e.replace(/\^/g, '**');
    // 安全：只允许数字、运算符、括号、Math函数
    if (!/^[0-9+\-*/().\sMathPIsincoatq]+$/.test(e)) return NaN;
    let result = Function('"use strict"; return (' + e + ')')();
    if (typeof result !== 'number' || !isFinite(result)) return NaN;
    return result;
  } catch(e) { return NaN; }
}

function getVal(name) {
  let el = document.querySelector(`[data-name="${name}"]`);
  if (!el) return NaN;
  return parseExpr(el.value);
}

function setResult(expr, result) {
  document.getElementById('expr').textContent = expr;
  document.getElementById('result').textContent = result;
}

function clearResult() {
  document.getElementById('expr').textContent = '';
  document.getElementById('result').textContent = '请输入数值';
}

// ============ 标签切换 ============
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    currentTab = tab.dataset.tab;
    document.getElementById('tab-' + currentTab).classList.add('active');
    activeInput = null;
    clearResult();
  });
});

// ============ 输入框点击 ============
document.querySelectorAll('.calc-input').forEach(input => {
  input.addEventListener('click', (e) => {
    document.querySelectorAll('.calc-input').forEach(i => i.classList.remove('readonly-highlight'));
    input.classList.add('readonly-highlight');
    activeInput = input;
    e.stopPropagation();
  });
});

// ============ 键盘按钮 ============
document.querySelectorAll('.btn').forEach(btn => {
  btn.addEventListener('click', () => {
    let key = btn.dataset.key;

    if (key === 'AC') {
      document.querySelectorAll('.calc-input').forEach(i => i.value = '');
      activeInput = null;
      clearResult();
      lastLength = null;
      return;
    }

    if (key === 'C') {
      if (activeInput) activeInput.value = '';
      clearResult();
      return;
    }

    if (key === 'BACK') {
      if (activeInput) activeInput.value = activeInput.value.slice(0, -1);
      return;
    }

    if (key === '±') {
      if (activeInput) {
        let v = activeInput.value;
        if (v.startsWith('-')) activeInput.value = v.slice(1);
        else if (v.length > 0) activeInput.value = '-' + v;
      }
      return;
    }

    if (key === '=') {
      doCalculate();
      return;
    }

    // 普通输入
    if (!activeInput) {
      // 自动选中第一个空框或第一个框
      let inputs = document.querySelectorAll('#tab-' + currentTab + ' .calc-input');
      activeInput = inputs[0];
      if (activeInput) activeInput.classList.add('readonly-highlight');
    }
    if (activeInput) {
      activeInput.value += key;
    }
  });
});

// 阻止物理键盘输入
document.addEventListener('keydown', (e) => {
  e.preventDefault();
});

// ============ 计算逻辑 ============
function doCalculate() {
  let expr = '';
  let result = '';

  switch(currentTab) {
    case 'll': {
      let x1=getVal('ll_p1x'), y1=getVal('ll_p1y'), x2=getVal('ll_p2x'), y2=getVal('ll_p2y');
      let x3=getVal('ll_q1x'), y3=getVal('ll_q1y'), x4=getVal('ll_q2x'), y4=getVal('ll_q2y');
      if ([x1,y1,x2,y2,x3,y3,x4,y4].some(isNaN)) { result='请输入有效数值'; break; }
      let a1=y2-y1, b1=x1-x2, c1=x2*y1-x1*y2;
      let a2=y4-y3, b2=x3-x4, c2=x4*y3-x3*y4;
      let det=a1*b2-a2*b1;
      if (Math.abs(det)<1e-12) { result='两直线平行或重合，无唯一交点'; break; }
      let ix=(b1*c2-b2*c1)/det, iy=(a2*c1-a1*c2)/det;
      expr=`直线1:(${x1},${y1})-(${x2},${y2}) ∩ 直线2:(${x3},${y3})-(${x4},${y4})`;
      result=`交点: (${ix.toFixed(6)}, ${iy.toFixed(6)})`;
      break;
    }

    case 'cc': {
      let cx1=getVal('cc_c1x'), cy1=getVal('cc_c1y'), r1=getVal('cc_r1');
      let cx2=getVal('cc_c2x'), cy2=getVal('cc_c2y'), r2=getVal('cc_r2');
      if ([cx1,cy1,r1,cx2,cy2,r2].some(isNaN)) { result='请输入有效数值'; break; }
      let dx=cx2-cx1, dy=cy2-cy1, d=Math.sqrt(dx*dx+dy*dy);
      if (d<1e-12) { result='两圆同心'; break; }
      if (d>r1+r2+1e-12) { result='两圆外离，无交点'; break; }
      if (d<Math.abs(r1-r2)-1e-12) { result='一圆内含另一圆，无交点'; break; }
      let a=(r1*r1-r2*r2+d*d)/(2*d);
      let h2=r1*r1-a*a;
      if (h2<-1e-12) { result='无解（精度问题）'; break; }
      if (h2<0) h2=0;
      let h=Math.sqrt(h2);
      let px=cx1+a*dx/d, py=cy1+a*dy/d;
      let pts=[];
      if (h<1e-12) {
        pts.push(`(${px.toFixed(6)}, ${py.toFixed(6)})`);
      } else {
        let ix1=px-h*dy/d, iy1=py+h*dx/d;
        let ix2=px+h*dy/d, iy2=py-h*dx/d;
        pts.push(`(${ix1.toFixed(6)}, ${iy1.toFixed(6)})`);
        pts.push(`(${ix2.toFixed(6)}, ${iy2.toFixed(6)})`);
      }
      expr=`圆1:(${cx1},${cy1}) r=${r1} ∩ 圆2:(${cx2},${cy2}) r=${r2}`;
      result=`交点(${pts.length}个): ${pts.join(', ')}`;
      break;
    }

    case 'lc': {
      let px=getVal('lc_px'), py=getVal('lc_py'), qx=getVal('lc_qx'), qy=getVal('lc_qy');
      let cx=getVal('lc_cx'), cy=getVal('lc_cy'), r=getVal('lc_r');
      if ([px,py,qx,qy,cx,cy,r].some(isNaN)) { result='请输入有效数值'; break; }
      let dx=qx-px, dy=qy-py;
      let A=dy, B=-dx, C=dx*py-dy*px;
      let denom=A*A+B*B;
      if (denom<1e-12) { result='直线方向无效'; break; }
      let x0=(B*(B*cx-A*cy)-A*C)/denom;
      let y0=(A*(-B*cx+A*cy)-B*C)/denom;
      let dist=Math.sqrt((cx-x0)*(cx-x0)+(cy-y0)*(cy-y0));
      if (dist>r+1e-12) { result='直线与圆外离，无交点'; break; }
      let h2=r*r-(cx-x0)*(cx-x0)-(cy-y0)*(cy-y0);
      if (h2<-1e-12) { result='无交点'; break; }
      if (h2<0) h2=0;
      let h=Math.sqrt(h2);
      let sqrtDenom=Math.sqrt(denom);
      let pts=[];
      if (h<1e-12) {
        pts.push(`(${x0.toFixed(6)}, ${y0.toFixed(6)})`);
      } else {
        let ix1=x0+h*dx/sqrtDenom, iy1=y0+h*dy/sqrtDenom;
        let ix2=x0-h*dx/sqrtDenom, iy2=y0-h*dy/sqrtDenom;
        pts.push(`(${ix1.toFixed(6)}, ${iy1.toFixed(6)})`);
        pts.push(`(${ix2.toFixed(6)}, ${iy2.toFixed(6)})`);
      }
      expr=`直线(${px},${py})-(${qx},${qy}) ∩ 圆(${cx},${cy}) r=${r}`;
      result=`交点(${pts.length}个): ${pts.join(', ')}`;
      break;
    }

    case 'tp': {
      let x=getVal('tp_x'), y=getVal('tp_y');
      if ([x,y].some(isNaN)) { result='请输入有效数值'; break; }
      let rho=Math.sqrt(x*x+y*y);
      let theta=Math.atan2(y,x)*180/Math.PI;
      if (theta<0) theta+=360;
      expr=`点(${x}, ${y}) → 极坐标`;
      result=`ρ=${rho.toFixed(6)}, θ=${theta.toFixed(4)}°`;
      break;
    }

    case 'pt': {
      let rho=getVal('pt_rho'), theta=getVal('pt_theta');
      if ([rho,theta].some(isNaN)) { result='请输入有效数值'; break; }
      let rad=theta*Math.PI/180;
      let x=rho*Math.cos(rad), y=rho*Math.sin(rad);
      expr=`ρ=${rho}, θ=${theta}° → 直角坐标`;
      result=`(${x.toFixed(6)}, ${y.toFixed(6)})`;
      break;
    }

    case '3c': {
      let ax=getVal('tc_ax'), ay=getVal('tc_ay');
      let bx=getVal('tc_bx'), by=getVal('tc_by');
      let cx=getVal('tc_cx'), cy=getVal('tc_cy');
      if ([ax,ay,bx,by,cx,cy].some(isNaN)) { result='请输入有效数值'; break; }
      let D=2*(ax*(by-cy)+bx*(cy-ay)+cx*(ay-by));
      if (Math.abs(D)<1e-12) { result='三点共线，无法确定圆'; break; }
      let ux=ax*ax+ay*ay, uy=bx*bx+by*by, uz=cx*cx+cy*cy;
      let hx=(ux*(by-cy)+uy*(cy-ay)+uz*(ay-by))/D;
      let hy=(ux*(cx-bx)+uy*(ax-cx)+uz*(bx-ax))/D;
      let r=Math.sqrt((ax-hx)*(ax-hx)+(ay-hy)*(ay-hy));
      expr=`三点 A(${ax},${ay}) B(${bx},${by}) C(${cx},${cy})`;
      result=`圆心: (${hx.toFixed(6)}, ${hy.toFixed(6)}), 半径: ${r.toFixed(6)}`;
      break;
    }

    case '2r': {
      let px=getVal('tr_px'), py=getVal('tr_py');
      let qx=getVal('tr_qx'), qy=getVal('tr_qy');
      let r=getVal('tr_r');
      if ([px,py,qx,qy,r].some(isNaN)) { result='请输入有效数值'; break; }
      let dx=qx-px, dy=qy-py;
      let d2=dx*dx+dy*dy;
      let d=Math.sqrt(d2);
      if (d<1e-12) { result='两点重合，无法确定'; break; }
      if (2*r<d-1e-12) { result='半径太小，两点距离大于直径'; break; }
      let midX=(px+qx)/2, midY=(py+qy)/2;
      let h2=r*r-d2/4;
      if (h2<-1e-12) { result='无解'; break; }
      if (h2<0) h2=0;
      let h=Math.sqrt(h2);
      let centers=[];
      if (h<1e-12) {
        centers.push(`(${midX.toFixed(6)}, ${midY.toFixed(6)})`);
      } else {
        let cx1=midX-h*dy/d, cy1=midY+h*dx/d;
        let cx2=midX+h*dy/d, cy2=midY-h*dx/d;
        centers.push(`(${cx1.toFixed(6)}, ${cy1.toFixed(6)})`);
        centers.push(`(${cx2.toFixed(6)}, ${cy2.toFixed(6)})`);
      }
      expr=`P(${px},${py}) Q(${qx},${qy}) r=${r}`;
      result=`圆心(${centers.length}个): ${centers.join(', ')}`;
      break;
    }

    case 'len': {
      let px=getVal('len_px'), py=getVal('len_py');
      let qx=getVal('len_qx'), qy=getVal('len_qy');
      let lenInput=document.querySelector('[data-name="len_l"]');
      let lenVal=parseExpr(lenInput?lenInput.value:'');

      if ([px,py,qx,qy].some(isNaN)) { result='请输入有效数值'; break; }

      let dx=qx-px, dy=qy-py;
      let curLen=Math.sqrt(dx*dx+dy*dy);

      if (!isNaN(lenVal) && lenVal>0) {
        // 有长度值 → 反求端点
        if (curLen<1e-12) { result='起点与端点重合，无法确定方向'; break; }
        let ratio=lenVal/curLen;
        let qx2=px+dx*ratio, qy2=py+dy*ratio;
        expr=`起点(${px},${py}), 方向→(${qx},${qy}), 长度=${lenVal}`;
        result=`端点 Q': (${qx2.toFixed(6)}, ${qy2.toFixed(6)})`;
        // 回写
        let qxEl=document.querySelector('[data-name="len_qx"]');
        let qyEl=document.querySelector('[data-name="len_qy"]');
        if (qxEl) qxEl.value=qx2.toFixed(6);
        if (qyEl) qyEl.value=qy2.toFixed(6);
      } else {
        // 无长度值 → 求当前长度
        expr=`P(${px},${py}) Q(${qx},${qy})`;
        result=`长度 = ${curLen.toFixed(6)}`;
        if (lenInput) {
          lenInput.value=curLen.toFixed(6);
          lastLength=curLen;
        }
      }
      break;
    }
  }

  setResult(expr, result);
}

// 点击空白取消高亮
document.addEventListener('click', () => {
  document.querySelectorAll('.calc-input').forEach(i => i.classList.remove('readonly-highlight'));
});
</script>
