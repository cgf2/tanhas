        el.classList.remove("as-pending", "as-saving", "as-error");
        el.classList.add("as-saved");                // 绿闪：该格被其他设备更新
      }
      if (op.k[0] === "h" || op.k[0] === "f") {
        if (op.k[0] === "h") TableModule.setHeaderField(op.k, op.v);   // 远端表头变更同步写入模型，避免 render 覆盖
        try {
          const snap = JSON.parse(localStorage.getItem("report_autosave_v1") || "{}") || {};
          snap[op.k] = String(op.v == null ? "" : op.v);
          localStorage.setItem("report_autosave_v1", JSON.stringify(snap));
        } catch (e) {}
      } else if (TableModule.applyCellKey(op.k, op.v, true)) {
        dirtyModel = true;
      }
    });
    if (any) persistTsSoon();
    if (dirtyModel) TableModule.refresh();
  }

  // 应用远端整快照（结构同步 / 首次加入 / 兜底收敛），按时间戳逐格合并防覆盖
  async function applyRemoteState(st) {
    try {
      if (!st || st.v !== 1 || !Array.isArray(st.model) || !st.model.length) return;
      try { await AutoSaveApp.flushAndSettle(); } catch (e) {}   // 先把本地未保存内容落盘并广播
      if (isEditing()) { pendingState = st; return; }
      const inTs = st.cellTs || {};
      const localModel = flatLocal();          // 采纳前先平铺记录本地值
      rev = Math.max(rev, st.rev || 0) + 1;

      // 结构不同 → 采纳远端结构；随后把本地较新的单元格值覆盖回去
      let adopted = false;
      if (JSON.stringify(st.model) !== localStorage.getItem("report_structure_v1")) {
        TableModule.adoptModel(st.model);
        AutoSaveApp.afterStructureChange();
        adopted = true;
      }
      // 逐格合并：远端较新 → 取远端；本地较新 → 保留并回播给对方
      const backOps = [];
      const now = Date.now();
      localModel.forEach((rec, k) => {
        if ((inTs[k] || 0) >= rec.ts) return;  // 远端更新或相等 → 保持远端值
        TableModule.applyCellKey(k, rec.v, true);
        cellTs[k] = Math.max(rec.ts, inTs[k] || 0);
        backOps.push({ k: k, v: rec.v, ts: cellTs[k] });
      });
      // 本地较新的表头/备注也回播
      try {
        const snap = JSON.parse(localStorage.getItem("report_autosave_v1") || "{}") || {};
        Object.keys(snap).forEach(k => {
          if (k[0] !== "h" && k[0] !== "f") return;
          const ts = cellTs[k] || now;
          if ((inTs[k] || 0) >= ts) return;
          cellTs[k] = ts;
          backOps.push({ k: k, v: String(snap[k] == null ? "" : snap[k]), ts: ts });
        });
      } catch (e) {}
      persistTs();
      TableModule.refresh();
      // 远端较新的表头/备注：统一走增量应用（写 DOM + 本地暂存 + 绿闪提示）
      const remoteOps = [];
      Object.keys(inTs).forEach(k => {
        if (k[0] !== "h" && k[0] !== "f" || localModel.has(k)) return;
        if ((cellTs[k] || 0) >= inTs[k]) return;
        remoteOps.push({ k: k, v: (st.hf && st.hf[k] != null) ? st.hf[k] : "", ts: inTs[k] });
      });
      // 远端较新的数据区单元格：结构相同未采纳模型时，从快照模型取值应用。
      // 没有这一步，错过的增量消息将永远无法被快照治愈（双端数据不一致的根源之一）。
      if (!adopted) {
        const valMap = {};
        st.model.forEach(g => {
          for (let i = 0; i < 5; i++) valMap[g.id + ".p." + i] = g[["no", "item", "name", "draw", "qty"][i]] || "";
          (g.steps || []).forEach(s => {
            for (let i = 0; i < 10; i++) valMap[g.id + "." + s.id + "." + i] = s[["step", "line", "mac", "takt", "done", "note", "worker", "total", "tool", "life"][i]] || "";
          });
        });
        Object.keys(inTs).forEach(k => {
          if (k[0] === "h" || k[0] === "f" || !(k in valMap)) return;
          if ((cellTs[k] || 0) >= inTs[k]) return;
          remoteOps.push({ k: k, v: valMap[k], ts: inTs[k] });
        });
      } else {
        // 已采纳模型：数据区值已随模型就位，补齐时间戳防同刻增量被重复接受
        Object.keys(inTs).forEach(k => {
          if (k[0] === "h" || k[0] === "f") return;
          if ((cellTs[k] || 0) < inTs[k]) cellTs[k] = inTs[k];
        });
      }
      if (remoteOps.length) applyRemoteCells(remoteOps);
      if (backOps.length) { enqueue({ kind: "cells", ops: backOps }); drain(); }
    } catch (e) {
      console.error("[Sync] 应用远端快照失败：", e);
    }
  }

  // 平铺本地模型为 {cid: {v, ts}}（同步合并用）
  function flatLocal() {
    const m = new Map();
    let model = [];
    try { model = JSON.parse(localStorage.getItem("report_structure_v1") || "[]") || []; } catch (e) {}
    model.forEach(g => {
      for (let i = 0; i < 5; i++) {
        const k = g.id + ".p." + i;
        m.set(k, { v: g[["no", "item", "name", "draw", "qty"][i]] || "", ts: cellTs[k] || 0 });
      }
      (g.steps || []).forEach(s => {
        for (let i = 0; i < 10; i++) {
          const k = g.id + "." + s.id + "." + i;
          m.set(k, { v: s[["step", "line", "mac", "takt", "done", "note", "worker", "total", "tool", "life"][i]] || "", ts: cellTs[k] || 0 });
        }
      });
    });
    return m;
  }

  // 注：不做周期性 retained 快照重发——数据陈旧的设备会把房间快照污染回旧值，
  // 导致其他设备刷新后采纳到陈旧数据（"刷新后重置为初始值"的放大器）。
  // 兜底恢复由 hello/ack 应答（非 retained，接收方按 ts 合并）+ retained 结构快照承担。

  function init() {
    bindUI();
    paintChip();
    if (room) connect(); else setStatus("off");
    document.addEventListener("focusout", () => {
      if (pendingState && !isEditing()) { const st = pendingState; pendingState = null; applyRemoteState(st); }
    });
    // 手机切后台/锁屏会挂起 WebSocket，回前台时主动恢复连接并补传离线队列
    document.addEventListener("visibilitychange", () => {
      if (document.hidden || !room) return;
      if (!client) { if (status !== "off" && status !== "error") reconnect(); return; }
      if (!client.connected) { if (!client.reconnecting) reconnect(); }
      else drainSoon();
    });
  }

  return {
    init: init,
    getState: getState,
    onStatusChange: onStatusChange,
    publishCellOps: publishCellOps,
    publishStructure: publishStructure,
    _dbg: function () {   // 测试诊断口
      return {
        status: status, room: room, rev: rev, outbox: outbox.length,
        broker: BROKERS[brokerIdx] || "", dev: DEV,
        tsKeys: Object.keys(cellTs).length
      };
    }
  };
})();

/* ================================================================
 * 模块七·五：班次追踪（StatsModule）
 * 职责：当班完成量的班次追踪——
 *  1) 日期 / 班组变更（表头失焦）或手动「班次结算」时，自动归档上一班次
 *     快照并清零当班完成；日期前进（跨天，如 +1 天）时先把当班完成累加进累计完成数量
 *  2) 历史班次可在「班次记录」浮层中跨班次追溯（含产出明细与合计）
 * ================================================================ */
const StatsModule = (() => {
  const SHIFT_KEY = "report_shift_v1";     // { shift:{date,team,since}, history:[{date,team,closedAt,rows:[...]}] }
  const DONE_COL = 4;                      // 当班完成在 STEP_COLS 中的下标
  const TOTAL_COL = 7;                     // 累计完成数量在 STEP_COLS 中的下标

  let shift = null;                        // 当前班次 { date, team, since }
  let history = [];                        // 已归档班次（新→旧）
  let popEl, shiftInfoEl, histEl, histCountEl;

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(SHIFT_KEY) || "null");
      if (s && typeof s === "object") {
        shift = s.shift || null;
        history = Array.isArray(s.history) ? s.history : [];
      }
    } catch (e) {}
  }
  function persist() {
    try { localStorage.setItem(SHIFT_KEY, JSON.stringify({ shift: shift, history: history })); } catch (e) {}
  }

  function currentHeader() {
    try {
      const h = JSON.parse(localStorage.getItem("report_header_v1") || "null");
      if (h && typeof h === "object") return h;
    } catch (e) {}
    return { title: "", date: "", team: "" };
  }

  // ---------- 班次追踪：变更检测 / 归档清零 / 历史追溯 ----------
  function initShift() {
    // 首次运行 localStorage 表头可能尚未持久化：优先读已渲染的表头 DOM
    const h = readHeaderLive();
    if (!shift) { shift = { date: h.date || "", team: h.team || "", since: Date.now() }; persist(); }
  }
  // 直接读表头 DOM（标题行固定列位：cells[2]=日期, cells[4]=班组），不依赖模型落盘时序
  function readHeaderLive() {
    const body = document.getElementById("tableBody");
    if (body && body.rows[0] && body.rows[0].cells.length >= 5) {
      const c = body.rows[0].cells;
      return { date: c[2].innerText.trim(), team: c[4].innerText.trim() };
    }
    return currentHeader();
  }
  // 表头（日期/班组）编辑完成（失焦）后调用：班次标识变化 → 归档上一班次并清零当班完成。
  // 失焦触发而非逐键触发：避免用户修改日期到一半时误归档。
  function onHeaderChange() {
    const h = readHeaderLive();
    if (!shift) { initShift(); return; }
    if (h.date === shift.date && h.team === shift.team) return;
    // 日期前进（跨天，如 +1 天）→ 本次归档先把各工序当班完成累加进累计完成数量
    closeShift(h, true, dayAdvanced(shift.date, h.date));
  }
  // 解析表头日期字符串（兼容 2026/10/25、2026-10-25 等格式）；无法解析返回 null
  function parseDay(str) {
    const m = String(str || "").match(/(\d{4})\D+(\d{1,2})\D+(\d{1,2})/);
    if (!m) return null;
    const d = new Date(+m[1], +m[2] - 1, +m[3]);
    return isNaN(d.getTime()) ? null : d;
  }
  // 新日期是否晚于旧日期（跨天前进，如 +1 天）
  function dayAdvanced(oldStr, newStr) {
    const a = parseDay(oldStr), b = parseDay(newStr);
    return !!(a && b && b.getTime() > a.getTime());
  }
  // 归档当前班次快照，清零当班完成，并切换到新班次。
  // accumulate=true（仅日期前进的自动检测路径传入）：先把各工序「当班完成」
  // 累加进「累计完成数量」再清零；否则保持原语义（累计完成保留不动）。
  function closeShift(newHeader, auto, accumulate) {
    if (!shift) { initShift(); return false; }
    const groups = TableModule.getGroups();
    // 日期前进：当班完成 → 累计完成数量（模型 + 单元格键，随下方清零一起广播同步）
    const vals = new Map();
    let accRows = 0;
    if (accumulate) {
      groups.forEach(g => g.steps.forEach(s => {
        const done = parseInt(s.done, 10);
        if (!done) return;
        s.total = String((parseInt(s.total, 10) || 0) + done);
        vals.set(g.id + "." + s.id + "." + TOTAL_COL, s.total);
        accRows++;
      }));
    }
    const snapRows = [];
    groups.forEach(g => g.steps.forEach(s => {
      snapRows.push({ no: g.no, item: g.item, name: g.name, step: s.step, mac: s.mac,
                      done: s.done, total: s.total });
    }));
    history.unshift({ date: shift.date, team: shift.team, closedAt: Date.now(), rows: snapRows });
    if (history.length > 60) history.length = 60;             // 上限防无限膨胀
    const nh = newHeader || currentHeader();
    shift = { date: nh.date || "", team: nh.team || "", since: Date.now() };
    persist();
    // 清零当班完成：模型 + 单元格键写入（本地持久化与多端同步广播）
    groups.forEach(g => g.steps.forEach(s => {
      if (String(s.done || "") !== "") { s.done = ""; vals.set(g.id + "." + s.id + "." + DONE_COL, ""); }
    }));
    TableModule.refresh();
    if (vals.size && typeof SyncModule !== "undefined") {
      if (SyncModule.publishCellOps) SyncModule.publishCellOps(vals);
      if (SyncModule.publishStructure) SyncModule.publishStructure();
    }
    renderShiftPanel();
    UIModule.show("success", (auto ? "检测到班次切换：" : "班次结算完成：") +
      "上一班次（" + (history[0].date || "—") + " " + (history[0].team || "—") + "）已归档 " +
      snapRows.length + " 行记录，" +
      (accumulate ? "当班完成量已累加进累计完成数量并清零（" + accRows + " 行有产出）。"
                  : "当班完成量已清零，累计完成保留。"));
    return true;
  }

  // ---------- 班次记录浮层（当前班次信息 + 跨班次历史追溯） ----------
  function renderShiftPanel() {
    if (shiftInfoEl) {
      const h = currentHeader();
      shiftInfoEl.textContent = "当前班次：" + (h.date || "—") + " " + (h.team || "—") +
        (shift && shift.since ? "（始于 " + new Date(shift.since).toLocaleString("zh-CN", { hour12: false }) + "）" : "");
    }
    if (histCountEl) histCountEl.textContent = history.length;
    if (histEl) {
      histEl.innerHTML = history.map((rec, i) => {
        const rows = rec.rows.filter(r => String(r.done || "").trim() !== "");
        const sum = rows.reduce((n, r) => n + (parseInt(r.done, 10) || 0), 0);
        const detail = rows.map(r =>
          "<tr><td>" + (r.no || "") + "</td><td>" + (r.item || "") + " " + (r.name || "") + "</td><td>" +
          (r.step || "") + "</td><td>" + (r.mac || "") + "</td><td>" + (r.done || "") + "</td><td>" + (r.total || "") + "</td></tr>"
        ).join("");
        return '<div class="stats-shift-card"><b>#' + (i + 1) + "　" + (rec.date || "—") + " " + (rec.team || "—") +
          "　归档于 " + new Date(rec.closedAt).toLocaleString("zh-CN", { hour12: false }) +
          "　当班完成合计 " + sum + " 件（" + rows.length + " 行有产出）</b>" +
          (detail ? '<table><tr><td>序号</td><td>项目/产品</td><td>工序</td><td>机床</td><td>当班完成</td><td>累计</td></tr>' +
            detail + "</table>" : '<div style="color:#8a94a6;margin-top:4px;">该班次无产出记录。</div>') + "</div>";
      }).join("") || '<div style="color:#8a94a6;">暂无历史班次记录。</div>';
    }
  }

  function bindUI() {
    popEl = document.getElementById("statsPop");
    shiftInfoEl = document.getElementById("statsShiftInfo");
    histEl = document.getElementById("statsHistory");
    histCountEl = document.getElementById("statsHistCount");
    document.getElementById("btnShiftLog").addEventListener("click", () => {
      const willShow = popEl.hidden;
      popEl.hidden = !willShow;
      if (willShow) renderShiftPanel();
    });
    document.getElementById("statsPopClose").addEventListener("click", () => { popEl.hidden = true; });
    document.getElementById("btnShiftClose").addEventListener("click", () => {
      if (confirm("确定要结算当前班次吗？\n\n将归档本班次全部「当班完成」数据，并把当班完成列清零（累计完成保留，可追溯）。"))
        closeShift(null, false);
    });
    // 表头编辑失焦 → 班次切换检测（仅本地编辑；远端表头变更不重复归档）
    document.addEventListener("focusout", e => {
      const td = e.target && e.target.closest ? e.target.closest("#tableBody td") : null;
      if (!td) return;
      const body = document.getElementById("tableBody");
      if (body && body.rows[0] === td.parentNode) setTimeout(onHeaderChange, 50);
    });
  }

  function init() {
    load();
    bindUI();
    initShift();
    renderShiftPanel();
  }

  return {
    init: init,
    onHeaderChange: onHeaderChange,
    closeShift: function () { return closeShift(null, false); },
    renderShiftPanel: renderShiftPanel,
    _dbg: function () {
      return { shift: shift, historyCount: history.length, history: history.slice(0, 3) };
    }
  };
})();

/* ================================================================
 * 模块八：数据导入（DataImportModule）
 * 职责：把 Excel 文件、以及从 Excel 复制的表格数据导入报表——
 *  1) 文件导入：.xlsx / .xlsm（内置 ZIP + XML 解析，无第三方依赖）；
 *     多工作表文件可选「选择工作表」下拉切换要导入的表
 *  2) 粘贴导入：在报表区域按 Ctrl+V，若剪贴板是多列表格
 *     （制表符分隔或 HTML 表格）则自动解析，单格文本粘贴保持原有行为
 *  3) 表头自动匹配：按字段名识别列归属；未识别到表头时按标准 15 列顺序落位
 *  4) 预览确认：可逐列调整目标字段、直接修正单元格内容；
 *     三种写入模式（追加为新项目 / 写入当前选中项目 / 替换全部项目）
 *  5) 写入复用 adoptModel + 自动保存 + 多端同步链路，与手工编辑数据完全一致
 * ================================================================ */
const DataImportModule = (() => {
  const MAX_SIZE = 20 * 1024 * 1024;      // 文件大小上限 20MB
  const STEP_KEY_LIST = ["step", "line", "mac", "takt", "done", "note", "worker", "total", "tool", "life"];
  const FIELDS = [
    { key: "p.no", label: "序号" }, { key: "p.item", label: "项目" },
    { key: "p.name", label: "产品名称" }, { key: "p.draw", label: "图号" },
    { key: "p.qty", label: "本批数量" }, { key: "s.step", label: "工序名称" },
    { key: "s.line", label: "生产线" }, { key: "s.mac", label: "机床编号" },
    { key: "s.takt", label: "加工节拍" }, { key: "s.done", label: "当班完成" },
    { key: "s.note", label: "进度及异常" }, { key: "s.worker", label: "加工人员" },
    { key: "s.total", label: "累计完成数量" }, { key: "s.tool", label: "使用刀具型号" },
    { key: "s.life", label: "刀具寿命" }
  ];
  // 标准 15 列顺序（与表头 HEADERS 一致）：无表头时按此顺序落位
  const CANON_ORDER = ["p.no", "p.item", "p.name", "p.draw", "p.qty", "s.step", "s.line", "s.mac",
                       "s.takt", "s.done", "s.note", "s.worker", "s.total", "s.tool", "s.life"];
  const FIELD_LABEL = {};
  FIELDS.forEach(f => { FIELD_LABEL[f.key] = f.label; });
  const NUM_KEYS = { "p.no": 1, "p.qty": 1, "s.done": 1, "s.total": 1 };
  // 表头精确字典优先（避免「工序名称」被「名称」类模糊规则抢走）
  const HEAD_EXACT = {
    "序号": "p.no", "项目": "p.item", "产品名称": "p.name", "产品": "p.name", "产品名": "p.name",
    "图号": "p.draw", "本批数量": "p.qty", "数量": "p.qty", "本批": "p.qty", "件数": "p.qty",
    "工序名称": "s.step", "工序": "s.step", "工步": "s.step",
    "生产线": "s.line", "线别": "s.line",
    "机床编号": "s.mac", "机床": "s.mac", "机台": "s.mac", "设备": "s.mac",
    "加工节拍": "s.takt", "节拍": "s.takt",
    "当班完成": "s.done", "当班完成量": "s.done", "当班": "s.done",
    "进度及异常": "s.note", "进度": "s.note", "异常": "s.note", "备注": "s.note",
    "加工人员": "s.worker", "人员": "s.worker", "操作者": "s.worker", "工人": "s.worker",
    "累计完成数量": "s.total", "累计完成": "s.total", "累计": "s.total",
    "使用刀具型号": "s.tool", "刀具型号": "s.tool", "刀具": "s.tool",
    "刀具寿命": "s.life", "寿命": "s.life"
  };
  // 模糊匹配（按特异度从高到低排列）
  const HEAD_HINTS = [
    [/工序|工步/, "s.step"], [/机床|机台|设备/, "s.mac"], [/生产线|线别/, "s.line"],
    [/加工节拍|节拍/, "s.takt"], [/当班/, "s.done"], [/刀具寿命|寿命/, "s.life"],
    [/刀具/, "s.tool"], [/加工人员|人员|操作|工人/, "s.worker"], [/累计/, "s.total"],
    [/异常|进度|备注/, "s.note"], [/图号/, "p.draw"], [/本批|数量|件数/, "p.qty"],
    [/产品/, "p.name"], [/项目|件号|零件/, "p.item"], [/序号/, "p.no"]
  ].map(pair => [pair[0], pair[1]]);

  let els = {}, grid = null, book = null, busy = false, seqNo = 0;

  function $(id) { return document.getElementById(id); }
  function show(msg, isErr) {
    els.progress.textContent = msg;
    els.progress.classList.toggle("err", !!isErr);
  }

  // ---------- 单元格标注：数字字段格式非法时红边提示（只标注不阻塞，由用户在预览中修正） ----------
  function applyCellMeta(inp, ri, ci) {
    const key = grid.map[ci];
    const v = String((grid.rows[ri] && grid.rows[ri][ci]) || "").trim();
    const isNum = !!key && !!NUM_KEYS[key];
    const bad = isNum && v !== "" && !/^[0-9.]+$/.test(v);
    inp.classList.toggle("bad-cell", bad);
  }

  // ---------- 表头识别 ----------
  function guessField(v) {
    const s = String(v == null ? "" : v).replace(/[\s　]+/g, "");
    if (!s) return "";
    if (HEAD_EXACT[s]) return HEAD_EXACT[s];
    for (let i = 0; i < HEAD_HINTS.length; i++) {
      if (HEAD_HINTS[i][0].test(s)) return HEAD_HINTS[i][1];
    }
    return "";
  }

  // 二维数组 → 判定是否含表头行，并生成列映射
  function detectMapping(rows) {
    let width = 0;
    rows.forEach(r => { if (r.length > width) width = r.length; });
    const first = [];
    for (let i = 0; i < width; i++) first.push(String((rows[0] && rows[0][i]) == null ? "" : rows[0][i]));
    let map = first.map(guessField);
    map.forEach((k, i) => { if (k && map.indexOf(k) < i) map[i] = ""; });   // 同字段重复列：只保留第一处
    const hits = map.filter(Boolean).length;
    const nonEmpty = first.filter(v => v.trim() !== "").length;
    const hasHeader = hits >= 3 || (hits >= 2 && hits >= Math.ceil(nonEmpty * 0.6));
    const headerNames = [];
    if (hasHeader) {
      for (let i = 0; i < width; i++) headerNames.push(first[i] || ("第" + (i + 1) + "列"));
      return { hasHeader: true, rows: rows.slice(1), map: map, headerNames: headerNames };
    }
    const map2 = [];
    for (let i = 0; i < width; i++) {
      const key = CANON_ORDER[i] || "";
      map2.push(key);
      headerNames.push(key ? FIELD_LABEL[key] : ("第" + (i + 1) + "列"));
    }
    return { hasHeader: false, rows: rows, map: map2, headerNames: headerNames };
  }

  // 规整二维数组：去掉整行空白、去掉右侧整列空白、统一行长度
  function normalizeRows(rows) {
    const kept = [];
    (rows || []).forEach(r => {
      const arr = (r || []).map(v => String(v == null ? "" : v).replace(/\u00a0/g, " ").replace(/\s+$/g, ""));
      if (arr.some(v => v !== "")) kept.push(arr);
    });
    let width = 0;
    kept.forEach(r => { for (let i = r.length - 1; i >= 0; i--) { if (r[i] !== "") { if (i + 1 > width) width = i + 1; break; } } })
    const out = kept.map(r => {
      const arr = r.slice(0, width);
      while (arr.length < width) arr.push("");
      return arr;
    });
    return out;
  }

  // ---------- 解析：制表符文本（Excel 复制） ----------
  function parseTSV(text) {
    const norm = String(text || "").replace(/\r\n?/g, "\n").replace(/\n+$/, "");
    if (!norm) return [];
    return norm.split("\n").map(line => {
      const cells = line.split("\t");
      return cells.map(c => c.replace(/^"(.*)"$/s, "$1").replace(/\u00a0/g, " "));
    });
  }

  // ---------- 解析：xlsx（ZIP + XML，纯浏览器实现，无需第三方库） ----------
  async function inflateRaw(bytes) {
    if (typeof DecompressionStream === "undefined")
      throw new Error("当前浏览器不支持解压 xlsx：请改用较新版本的 Chrome / Edge 打开本页，或直接在 Excel 中复制数据后粘贴到报表区域");
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return new Uint8Array(await new Response(stream).arrayBuffer());
  }
  function colToIndex(letters) {
    let n = 0;
    const s = String(letters || "").toUpperCase();
    for (let i = 0; i < s.length; i++) {
      const v = s.charCodeAt(i) - 64;
      if (v >= 1 && v <= 26) n = n * 26 + v;
    }
    return n - 1;
  }

  // 打开 ZIP：解析中央目录并返回可复用的读取句柄（同一文件切换工作表时无需重复解析）
  function openZip(buf) {
    const u8 = new Uint8Array(buf), dv = new DataView(buf);
    let eocd = -1;
    const lowest = Math.max(0, u8.length - 66000);
    for (let i = u8.length - 22; i >= lowest; i--) {
      if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
    }
    if (eocd < 0) throw new Error("不是有效的 xlsx 文件（未找到 ZIP 结构），请确认文件未损坏");
    const count = dv.getUint16(eocd + 10, true);
    let p = dv.getUint32(eocd + 16, true);
    const entries = {}, names = [];
    for (let i = 0; i < count; i++) {
      if (p + 46 > u8.length || dv.getUint32(p, true) !== 0x02014b50) break;
      const method = dv.getUint16(p + 10, true);
      const compSize = dv.getUint32(p + 20, true);
      const nameLen = dv.getUint16(p + 28, true);
      const extraLen = dv.getUint16(p + 30, true);
      const cmtLen = dv.getUint16(p + 32, true);
      const localOff = dv.getUint32(p + 42, true);
      const name = new TextDecoder("utf-8").decode(u8.subarray(p + 46, p + 46 + nameLen));
      entries[name] = { method: method, compSize: compSize, localOff: localOff };
      names.push(name);
      p += 46 + nameLen + extraLen + cmtLen;
    }
    async function readEntry(name) {
      const e = entries[name];
      if (!e) return null;
      const nLen = dv.getUint16(e.localOff + 26, true);
      const xLen = dv.getUint16(e.localOff + 28, true);
      const start = e.localOff + 30 + nLen + xLen;
      const comp = u8.subarray(start, start + e.compSize);
      const bytes = e.method === 0 ? comp : await inflateRaw(comp);
      return new TextDecoder("utf-8").decode(bytes);
    }
    return { names: names, readEntry: readEntry, shared: null };
  }

  // 工作表清单：优先按工作簿内定义顺序（xl/workbook.xml 中的 sheet 名 + rels 目标路径），
  // 读不到工作簿定义时回退为工作表文件名排序（名称退化为「工作表N」）
  async function listSheets(zip) {
    const wb = await zip.readEntry("xl/workbook.xml");
    const rels = await zip.readEntry("xl/_rels/workbook.xml.rels");
    if (wb && rels) {
      const relMap = {};
      const rs = new DOMParser().parseFromString(rels, "application/xml").getElementsByTagName("Relationship");
      for (let i = 0; i < rs.length; i++) {
        const id = rs[i].getAttribute("Id") || "";
        let target = rs[i].getAttribute("Target") || "";
        if (!id || !target || /^https?:/i.test(target)) continue;
        if (target.charAt(0) === "/") target = target.replace(/^\/+/, "");             // 绝对路径：xl/worksheets/…
        else if (target.indexOf("xl/") !== 0) target = "xl/" + target.replace(/^\.\//, "");
        relMap[id] = target;
      }
      const sheets = new DOMParser().parseFromString(wb, "application/xml").getElementsByTagName("sheet");
      const out = [];
      for (let i = 0; i < sheets.length; i++) {
        const path = relMap[sheets[i].getAttribute("r:id") || sheets[i].getAttribute("id") || ""];
        if (path) out.push({ name: sheets[i].getAttribute("name") || ("工作表" + (i + 1)), path: path });
      }
      if (out.length) return out;
    }
    return zip.names.filter(n => /^xl\/worksheets\/sheet\d+\.xml$/.test(n))
      .sort((a, b) => a.localeCompare(b, "en", { numeric: true }))
      .map((n, i) => ({ name: "工作表" + (i + 1), path: n }));
  }

  // 读取指定工作表为二维数组（共享字符串表按文件缓存，切换工作表时不重复解析）
  async function readSheet(zip, path) {
    if (!zip.shared) {
      const list = [];
      const sharedXml = await zip.readEntry("xl/sharedStrings.xml");
      if (sharedXml) {
        const sis = new DOMParser().parseFromString(sharedXml, "application/xml").getElementsByTagName("si");
        for (let i = 0; i < sis.length; i++) {
          const ts = sis[i].getElementsByTagName("t");
          let text = "";
          for (let j = 0; j < ts.length; j++) text += ts[j].textContent || "";
          list.push(text);
        }
      }
      zip.shared = list;
    }
    const shared = zip.shared;
    const xml = await zip.readEntry(path);
    if (!xml) throw new Error("未找到工作表数据：" + path);
    const doc = new DOMParser().parseFromString(xml, "application/xml");
    const rowEls = doc.getElementsByTagName("row");
    const out = [];
    for (let i = 0; i < rowEls.length; i++) {
      const rowEl = rowEls[i];
      const rIdx = (parseInt(rowEl.getAttribute("r"), 10) || (i + 1)) - 1;
      const arr = [];
      const cEls = rowEl.getElementsByTagName("c");
      for (let j = 0; j < cEls.length; j++) {
        const c = cEls[j];
        const ref = c.getAttribute("r") || "";
        const ci = ref ? colToIndex(ref.replace(/[0-9]/g, "")) : j;
        const t = c.getAttribute("t") || "";
        let val = "";
        if (t === "inlineStr") {
          const ts = c.getElementsByTagName("t");
          for (let k = 0; k < ts.length; k++) val += ts[k].textContent || "";
        } else {
          const vEl = c.getElementsByTagName("v")[0];
          const raw = vEl ? (vEl.textContent || "") : "";
          if (t === "s") {
            const idx = parseInt(raw, 10);
            val = isNaN(idx) ? "" : (shared[idx] || "");
          } else val = raw;
        }
        if (ci >= 0) arr[ci] = val;
      }
      out[rIdx] = arr;
    }
    const grid2 = [];
    for (let i = 0; i < out.length; i++) {
      const r = out[i];
      if (!r) { grid2.push([]); continue; }
      const arr = [];
      for (let j = 0; j < r.length; j++) arr.push(r[j] == null ? "" : String(r[j]));
      grid2.push(arr);
    }
    return grid2;
  }

  // ---------- 解析：剪贴板 HTML 表格 ----------
  function parseHtmlTable(html) {
    try {
      const doc = new DOMParser().parseFromString(String(html), "text/html");
      const table = doc.querySelector("table");
      if (!table) return null;
      const rows = [];
      const trs = table.rows;
      for (let i = 0; i < trs.length; i++) {
        const arr = [];
        const cells = trs[i].cells;
        for (let j = 0; j < cells.length; j++) {
          const span = parseInt(cells[j].getAttribute("colspan") || "1", 10) || 1;
          arr.push((cells[j].textContent || "").replace(/\u00a0/g, " ").trim());
          for (let k = 1; k < span; k++) arr.push("");
        }
        rows.push(arr);
      }
      return rows;
    } catch (e) { return null; }
  }

  // ---------- 打开模态框并渲染预览 ----------
  // 打开时先把当前结构落盘：首次打开页面时 localStorage 可能尚无结构，
  // 而预览提示与写入都以该结构为基准（保证基准与当前表格一致）
  function openModal() { TableModule.persistStructure(); els.modal.hidden = false; }
  function closeModal() {
    seqNo++;                          // 使在途解析回调失效
    els.modal.hidden = true;
    els.replaceWarn.hidden = true;    // 关闭即撤销待确认的替换操作
    grid = null;
  }

  // 渲染预览：保留原有写入模式选择（切换工作表时不必重新选择模式）
  function applyRows(rows, sourceLabel, keepMode) {
    const clean = normalizeRows(rows);
    if (!clean.length) {
      openModal();
      els.mapRow.hidden = true;
      els.gridWrap.hidden = true;
      els.confirm.disabled = true;
      els.replaceWarn.hidden = true;
      show("未解析到有效数据：请检查所选工作表中是否包含表格内容。", true);
      return;
    }
    const det = detectMapping(clean);
    grid = { rows: det.rows, map: det.map, headerNames: det.headerNames, hasHeader: det.hasHeader, source: sourceLabel };
    openModal();
    els.replaceWarn.hidden = true;
    if (!keepMode) els.modeNew.checked = true;   // 每次新导入重置为默认安全模式（追加），避免上次残留的替换模式误触发
    show("已解析 " + grid.rows.length + " 行 × " + grid.map.length + " 列（来源：" + sourceLabel + "）。" +
      (det.hasHeader ? "已按表头自动匹配字段，请核对下方列映射。" : "未识别到表头，已按标准 15 列顺序落位，请核对列映射。"));
    renderPreview();
    updateModeHint();
  }

  // 粘贴 / 测试注入入口：非文件导入，隐藏工作表选择
  function openWithGrid(rows, sourceLabel) {
    book = null;
    els.sheetRow.hidden = true;
    applyRows(rows, sourceLabel, false);
  }

  function renderPreview() {
    els.mapRow.innerHTML = "";
    grid.map.forEach((key, ci) => {
      const item = document.createElement("div");
      item.className = "dm-map-item";
      const name = document.createElement("span");
      name.textContent = grid.headerNames[ci] || ("第" + (ci + 1) + "列");
      name.title = "来源列：" + name.textContent;
      const sel = document.createElement("select");
      sel.dataset.ci = String(ci);
      let opts = '<option value="">（忽略）</option>';
      FIELDS.forEach(f => { opts += '<option value="' + f.key + '">' + f.label + "</option>"; });
      sel.innerHTML = opts;
      sel.value = key || "";
      sel.addEventListener("change", onMappingChange);
      item.appendChild(name);
      item.appendChild(sel);
      els.mapRow.appendChild(item);
    });
    els.mapRow.hidden = false;

    els.gridHead.innerHTML = "<tr><th>#</th>" + grid.map.map(() => "<th></th>").join("") + "</tr>";
    els.gridBody.innerHTML = "";
    grid.rows.forEach((row, ri) => {
      const tr = document.createElement("tr");
      const idx = document.createElement("td");
      idx.textContent = String(ri + 1);
      tr.appendChild(idx);
      for (let ci = 0; ci < grid.map.length; ci++) {
        const td = document.createElement("td");
        if (!grid.map[ci]) td.className = "ignored";
        const inp = document.createElement("input");
        inp.type = "text";
        inp.value = String((row && row[ci]) == null ? "" : row[ci]);
        inp.dataset.r = String(ri);
        inp.dataset.c = String(ci);
        inp.disabled = !grid.map[ci];
        applyCellMeta(inp, ri, ci);
        td.appendChild(inp);
        tr.appendChild(td);
      }
      els.gridBody.appendChild(tr);
    });
    els.gridWrap.hidden = false;
    refreshMappingUI();
    els.confirm.disabled = grid.rows.length === 0;
  }

  // 列映射变更：更新模型后仅局部刷新（不重建 DOM，保持焦点与滚动位置）
  function onMappingChange(e) {
    const sel = e.target;
    const ci = Number(sel.dataset.ci);
    const v = sel.value;
    if (v) grid.map.forEach((k, i) => { if (i !== ci && k === v) grid.map[i] = ""; });   // 同字段去重：其他列置为忽略
    grid.map[ci] = v;
    refreshMappingUI();
  }

  function refreshMappingUI() {
    els.mapRow.querySelectorAll("select").forEach(sel => {
      const ci = Number(sel.dataset.ci);
      const want = grid.map[ci] || "";
      if (sel.value !== want) sel.value = want;   // 被去重置空的列同步反映（不触发 change）
    });
    const ths = els.gridHead.querySelectorAll("th");
    grid.map.forEach((k, ci) => {
      const th = ths[ci + 1];                     // 第 0 个是 "#" 列
      if (!th) return;
      const name = grid.headerNames[ci] || ("第" + (ci + 1) + "列");
      const target = name + (k ? " → " + FIELD_LABEL[k] : "");
      if (th.textContent !== target) th.textContent = target;
    });
    els.gridBody.querySelectorAll("input[data-c]").forEach(inp => {
      const ri = Number(inp.dataset.r), ci = Number(inp.dataset.c);
      const on = !!grid.map[ci];
      if (inp.disabled !== !on) inp.disabled = !on;
      inp.parentNode.classList.toggle("ignored", !on);
      applyCellMeta(inp, ri, ci);
    });
  }

  // ---------- 写入（复用自动保存 + 多端同步链路） ----------
  // 按项目字段归组：纵向合并单元格（项目文字只在中间行出现）的前导空组并入后组
  function groupRows() {
    const get = (r, key) => {
      for (let c = 0; c < grid.map.length; c++) if (grid.map[c] === key) return String((grid.rows[r] && grid.rows[r][c]) || "").trim();
      return "";
    };
    const norm = (key, v) => NUM_KEYS[key] ? String(v).replace(/[^0-9.]/g, "") : v;
    const out = [];
    grid.rows.forEach((_row, r) => {
      const pvals = {}, svals = {};
      FIELDS.forEach(f => {
        const v = norm(f.key, get(r, f.key));
        if (!v) return;
        if (f.key.charAt(0) === "p") pvals[f.key.slice(2)] = v;
        else svals[f.key.slice(2)] = v;
      });
      // 分组键只用项目标识字段（项目 + 产品名称）并归一化去空白，避免同项目被拆成多组
      const sig = [pvals.item, pvals.name].map(v => String(v || "").replace(/\s+/g, "")).join("|");
      let g = out[out.length - 1];
      if (!g || (sig.replace(/\|+$/, "") !== "" && sig !== g.__sig)) {
        g = { __sig: sig, item: "", name: "", draw: "", qty: "", steps: [] };
        out.push(g);
      }
      ["item", "name", "draw", "qty"].forEach(k => { if (pvals[k]) g[k] = pvals[k]; });
      if (Object.keys(svals).length) g.steps.push(svals);
      else if (g.steps.length === 0) g.steps.push({});
    });
    while (out.length > 1 && ["item", "name", "draw", "qty"].every(k => !out[0][k])) {
      const lead = out.shift();
      out[0].steps = lead.steps.concat(out[0].steps);
    }
    out.forEach(g => delete g.__sig);
    return out;
  }

  // ---------- 结构化输出：固定 15 字段顺序的 JSON ----------
  function buildCanonicalJson() {
    const get = (r, key) => {
      for (let c = 0; c < grid.map.length; c++) if (grid.map[c] === key) return String((grid.rows[r] && grid.rows[r][c]) || "").trim();
      return "";
    };
    return grid.rows.map((_r, ri) => {
      const o = {};
      FIELDS.forEach(f => { o[f.label] = get(ri, f.key); });
      return o;
    });
  }
  async function copyCanonicalJson() {
    if (!grid || !grid.rows.length) { show("暂无可导出的数据。", true); return; }
    const text = JSON.stringify(buildCanonicalJson(), null, 2);
    try {
      await navigator.clipboard.writeText(text);
      show("已复制 " + grid.rows.length + " 行结构化 JSON（固定 15 字段顺序）到剪贴板。");
    } catch (e) {
      // 剪贴板 API 不可用（非安全上下文）时降级为临时 textarea
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); show("已复制 " + grid.rows.length + " 行结构化 JSON 到剪贴板。"); }
      catch (e2) { show("复制失败：请手动选择预览表数据后复制。", true); }
      document.body.removeChild(ta);
    }
  }

  function currentMode() {
    if (els.modeRep.checked) return "replace";
    if (els.modeCur.checked) return "current";
    return "new";
  }

  // ---------- 模式提示（实时联动当前选中项目 / 危险模式警示） ----------
  function updateModeHint() {
    const hint = els.modeHint;
    hint.className = "dm-mode-hint";
    els.confirm.classList.toggle("btn-danger", false);
    if (!grid || !grid.rows.length) { hint.textContent = ""; return; }
    const m = currentMode();
    if (m === "current") {
      const loc = TableModule.locateCursor();
      let model = [];
      try { model = JSON.parse(localStorage.getItem("report_structure_v1") || "[]") || []; } catch (e) {}
      if (loc && model[loc.g]) {
        const g = model[loc.g];
        hint.textContent = "将把导入的工序行追加到当前选中项目：" +
          [g.item, g.name].filter(Boolean).join(" ") + "（第 " + (loc.g + 1) + " 个项目）。";
      } else {
        hint.className = "dm-mode-hint warn";
        hint.textContent = "尚未选中项目：请先关闭本窗口，在报表中点击要写入的项目数据行，再重新打开本窗口。";
      }
    } else if (m === "replace") {
      hint.className = "dm-mode-hint danger";
      hint.textContent = "危险操作：将用导入结果替换报表中的全部项目，现有内容会被清除（点击确认后还会二次提示）。";
      els.confirm.classList.toggle("btn-danger", true);
      els.confirm.textContent = "替换全部项目…";
    } else {
      hint.textContent = "导入的项目将追加到现有项目列表末尾，不影响已有数据。";
    }
    if (m !== "replace") els.confirm.textContent = "确认写入报表";
  }

  async function applyParsed(confirmedReplace) {
    if (!grid || !grid.rows.length || busy) return;
    const mode = currentMode();
    if (mode === "current" && !TableModule.canOperate()) {
      show("未选中项目：请先在报表中点击一个项目数据行，或改选「追加为新项目」。", true);
      updateModeHint();
      return;
    }
    if (mode === "replace" && !confirmedReplace) {
      // 二次确认：统计两侧数据规模，弹出醒目警告条，必须点击「确认替换」才会执行
      let oldModel = [];
      try { oldModel = JSON.parse(localStorage.getItem("report_structure_v1") || "[]") || []; } catch (e) {}
      const og = oldModel.length;
      const os = oldModel.reduce((n, g) => n + (g.steps ? g.steps.length : 0), 0);
      let out = [];
      try { out = groupRows(); } catch (e) {}
      const ng = out.length;
      const ns = out.reduce((n, g) => n + g.steps.length, 0);
      els.replaceText.textContent = "即将删除现有 " + og + " 个项目（共 " + os + " 道工序），替换为导入的 " +
        ng + " 个项目（共 " + ns + " 道工序）。替换后原数据无法恢复，请仔细核对！";
      els.replaceWarn.hidden = false;
      els.replaceWarn.scrollIntoView({ block: "nearest" });
      els.confirm.disabled = true;
      return;
    }
    busy = true;
    els.confirm.disabled = true;
    els.replaceWarn.hidden = true;
    try {
      show("正在写入报表…");
      await AutoSaveApp.flushAndSettle();
      let model;
      try { model = JSON.parse(localStorage.getItem("report_structure_v1") || "[]") || []; } catch (e) { model = []; }
      if (mode !== "replace" && (!Array.isArray(model) || !model.length)) throw new Error("报表数据异常，无法写入。");

      const out = groupRows();
      if (!out.length) throw new Error("没有可写入的数据行。");
      if (mode === "current" && out.length > 1) out.splice(1);   // 写入当前项目时只取第一组

      // 只收集本次写入的单元格键值（盖时间戳 + 增量广播，防远端旧值回灌）
      const vals = new Map();
      let stepCount = 0;
      const pKeys = { no: "p.0", item: "p.1", name: "p.2", draw: "p.3", qty: "p.4" };
      const collectGroup = g => {
        Object.keys(pKeys).forEach(k => { if (g[k]) vals.set(g.id + "." + pKeys[k], g[k]); });
        g.steps.forEach(s => STEP_KEY_LIST.forEach((k, i) => { if (s[k]) vals.set(g.id + "." + s.id + "." + i, s[k]); }));
      };
      const buildGroup = (p, idx) => {
        const g = { id: TableModule.uid(), no: String(idx + 1), item: p.item, name: p.name, draw: p.draw, qty: p.qty, steps: [] };
        p.steps.forEach(s => g.steps.push(Object.assign({ id: TableModule.uid() }, s)));
        if (!g.steps.length) g.steps.push({ id: TableModule.uid() });
        return g;
      };
      if (mode === "replace") {
        const fresh = [];
        out.forEach((p, idx) => {
          const g = buildGroup(p, idx);
          fresh.push(g);
          collectGroup(g);
          stepCount += g.steps.length;
        });
        model = fresh;
      } else if (mode === "new") {
        out.forEach((p, idx) => {
          const g = buildGroup(p, model.length + idx);
          model.push(g);
          collectGroup(g);                    // 仅广播本次新增的组
          stepCount += g.steps.length;
        });
      } else {
        const loc = TableModule.locateCursor();
        if (!loc) throw new Error("未选中项目行。");
        const g = model[loc.g];
        const p0 = out[0];
        ["item", "name", "draw", "qty"].forEach(k => {
          if (p0[k]) { g[k] = p0[k]; vals.set(g.id + "." + pKeys[k], g[k]); }   // 仅广播实际覆盖的项目字段
        });
        p0.steps.forEach(s => {
          const ns = Object.assign({ id: TableModule.uid() }, s);
          g.steps.push(ns);
          STEP_KEY_LIST.forEach((k, i) => { if (ns[k]) vals.set(g.id + "." + ns.id + "." + i, ns[k]); });
          stepCount++;
        });
      }
      if (!TableModule.adoptModel(model)) throw new Error("数据格式校验未通过（存在空项目）。");
      AutoSaveApp.afterStructureChange();
      if (typeof SyncModule !== "undefined") {
        if (SyncModule.publishCellOps) SyncModule.publishCellOps(vals);
        if (SyncModule.publishStructure) SyncModule.publishStructure();
      }
      closeModal();
      UIModule.show("success", mode === "replace"
        ? "替换完成：报表现有 " + out.length + " 个项目（共 " + stepCount + " 道工序），原数据已被清除。"
        : "数据导入完成：已写入 " + stepCount + " 个工序行" +
          (mode === "new" ? "（含 " + out.length + " 个新项目）" : "（写入当前选中项目）") + "。");
    } catch (e) {
      show("写入失败：" + (e && e.message ? e.message : "未知错误") + "。原有数据未受影响，可修正后重试。", true);
      els.confirm.disabled = false;
    } finally {
      busy = false;
    }
  }

  // ---------- 文件导入 ----------
  function validateFile(file) {
    if (!file) return "未选择文件。";
    if (!/\.(xlsx|xlsm)$/i.test(file.name || ""))
      return "不支持的文件格式：请选择 Excel 文件（.xlsx / .xlsm）。旧版 .xls 请在 Excel 中「另存为 .xlsx」，或直接复制数据后粘贴到报表区域。";
    if (file.size > MAX_SIZE)
      return "文件超过 20MB 限制（当前 " + (file.size / 1048576).toFixed(1) + "MB），请精简后重试。";
    return null;
  }

  // 填充「选择工作表」下拉：文件导入时始终显示，方便核对当前读取的是哪张表
  function fillSheetSelect() {
    els.sheetSel.innerHTML = "";
    book.sheets.forEach((s, i) => {
      const opt = document.createElement("option");
      opt.value = String(i);
      opt.textContent = s.name;
      els.sheetSel.appendChild(opt);
    });
    els.sheetSel.value = "0";
    els.sheetRow.hidden = false;
  }

  // 读取并预览指定序号的 worksheet（切换工作表时保留已选的写入模式）
  async function loadBookSheet(idx, keepMode, seq) {
    const sheet = book.sheets[idx];
    if (!sheet) return;
    show("正在读取工作表「" + sheet.name + "」…");
    const rows = await readSheet(book.zip, sheet.path);
    if (seq != null && seq !== seqNo) return;
    const label = "文件 " + book.name + (book.sheets.length > 1 ? " · 工作表「" + sheet.name + "」" : "");
    applyRows(rows, label, keepMode);
    els.sheetRow.hidden = false;
  }

  async function handleFile(file) {
    const err = validateFile(file);
    openModal();
    book = null;
    els.sheetRow.hidden = true;
    els.mapRow.hidden = true;
    els.gridWrap.hidden = true;
    els.confirm.disabled = true;
    els.replaceWarn.hidden = true;
    if (err) { show(err, true); return; }
    const seq = ++seqNo;
    show("正在解析文件：" + file.name + " …");
    try {
      const zip = openZip(await file.arrayBuffer());
      const sheets = await listSheets(zip);
      if (!sheets.length) throw new Error("xlsx 中未找到工作表数据");
      if (seq !== seqNo) return;
      book = { zip: zip, sheets: sheets, name: file.name };
      fillSheetSelect();
      await loadBookSheet(0, false, seq);
    } catch (e) {
      if (seq !== seqNo) return;
      show("解析失败：" + (e && e.message ? e.message : "未知错误") + "。", true);
    }
  }

  // ---------- 粘贴导入 ----------
  function onPaste(e) {
    if (els.modal && !els.modal.hidden) return;          // 模态框内的粘贴走默认行为
    const target = e.target;
    const td = target && target.closest ? target.closest("#tableBody td") : null;
    if (!td) return;
    const cd = e.clipboardData || window.clipboardData;
    if (!cd) return;
    const text = cd.getData("text/plain") || "";
    const html = cd.getData("text/html") || "";
    let rows = null, src = "";
    if (text.indexOf("\t") >= 0) {
      rows = parseTSV(text);
      src = "剪贴板（Excel 复制）";
    } else if (/<t[ad][\s>]/i.test(html)) {
      const g = parseHtmlTable(html);
      if (g && g.length && g.some(r => r.length >= 2)) { rows = g; src = "剪贴板（HTML 表格）"; }
    }
    if (!rows) return;                                   // 单格 / 普通文本粘贴：交给浏览器默认行为
    e.preventDefault();
    openWithGrid(rows, src);
  }

  function init() {
    els = {
      modal: $("dmModal"), progress: $("dmProgress"), mapRow: $("dmMapRow"),
      gridWrap: $("dmGridWrap"), gridHead: $("dmGridHead"), gridBody: $("dmGridBody"),
      confirm: $("dmConfirm"), modeCur: $("dmModeCur"), fileInput: $("dmFileInput"),
      modeNew: $("dmModeNew"), modeRep: $("dmModeRep"), modeHint: $("dmModeHint"),
      replaceWarn: $("dmReplaceWarn"), replaceText: $("dmReplaceText"),
      replaceYes: $("dmReplaceYes"), replaceNo: $("dmReplaceNo"),
      sheetRow: $("dmSheetRow"), sheetSel: $("dmSheetSel")
    };
    $("btnDataImport").addEventListener("click", () => els.fileInput.click());
    $("dmRechoose").addEventListener("click", () => els.fileInput.click());
    $("dmCopyJson").addEventListener("click", copyCanonicalJson);
    $("dmCancel").addEventListener("click", closeModal);
    $("dmClose").addEventListener("click", closeModal);
    els.confirm.addEventListener("click", () => applyParsed(false));
    // 替换模式二次确认条
    els.replaceYes.addEventListener("click", () => applyParsed(true));
    els.replaceNo.addEventListener("click", () => {
      els.replaceWarn.hidden = true;
      if (!busy) els.confirm.disabled = !grid || !grid.rows.length;
    });
    // 切换写入模式：实时刷新提示；撤销未完成的替换确认
    document.querySelectorAll('input[name="dmMode"]').forEach(radio => {
      radio.addEventListener("change", () => {
        els.replaceWarn.hidden = true;
        if (!busy) els.confirm.disabled = !grid || !grid.rows.length;
        updateModeHint();
      });
    });
    // 预览表内容编辑：写回模型 + 即时校验
    els.gridBody.addEventListener("input", e => {
      const t = e.target;
      if (t && t.dataset.r != null && grid) {
        const ri = Number(t.dataset.r), ci = Number(t.dataset.c);
        if (!grid.rows[ri]) grid.rows[ri] = [];
        grid.rows[ri][ci] = t.value;
        applyCellMeta(t, ri, ci);
      }
    });
    // 切换工作表：重新读取所选 worksheet 并刷新预览（保留已选的写入模式）
    els.sheetSel.addEventListener("change", () => {
      if (!book) return;
      loadBookSheet(Number(els.sheetSel.value) || 0, true, ++seqNo);
    });
    els.fileInput.addEventListener("change", () => {
      const file = els.fileInput.files && els.fileInput.files[0];
      els.fileInput.value = "";          // 允许重复选择同一文件
      if (file) handleFile(file);
    });
    document.addEventListener("paste", onPaste);
  }

  // 测试诊断口：_testFromRows 供自动化测试直接注入二维数组，跳过文件选择
  return {
    init: init,
    _testFromRows: function (rows, label) { openWithGrid(rows, label || "测试数据"); },
    _testFile: function (file) { return handleFile(file); },
    _testPaste: function (text) { onPaste({ target: document.querySelector("#tableBody td"), clipboardData: { getData: function (t) { return t === "text/plain" ? text : ""; } }, preventDefault: function () {} }); },
    _dbg: function (full) {
      const base = { busy: busy, rows: grid ? grid.rows.length : 0, mapped: grid ? grid.map.filter(Boolean).length : 0 };
      if (full && grid) { base.map = grid.map.slice(); base.headerNames = grid.headerNames.slice(); base.hasHeader = grid.hasHeader; base.rowsData = grid.rows.slice(0, 30); }
      return base;
    }
  };
})();

/* ================= 启动 ================= */
TableModule.init();
UIModule.bind();
AutoSaveApp.init();
SyncModule.init();
StatsModule.init();
DataImportModule.init();
</script>
</body>
